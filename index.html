father terlihat tidak bersalah.","Each night, choose one player to protect. If the Mafia attacks them, they survive. You may not protect the same player two nights in a row.":"Setiap malam, pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya, dia selamat. Kamu tidak boleh melindungi orang yang sama dua malam berturut-turut.","Once per game, choose one player to guard. Your choice is permanent. The first attack on that player is blocked.":"Sekali dalam permainan, pilih satu pemain untuk dijaga. Pilihanmu permanen. Serangan pertama ke pemain itu akan ditahan.","You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you.":"Pelurumu terbatas. Di malam hari kamu boleh menembak satu pemain. Kalau yang kamu tembak ternyata warga tak bersalah, rasa bersalah bisa membunuhmu.","Each night, the Mafia agrees on one player to eliminate. Blend in during the day and avoid suspicion.":"Setiap malam, Mafia sepakat menghabisi satu pemain. Berbaurlah di siang hari dan hindari kecurigaan.","You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent.":"Kamu pemimpin Mafia. Pilihan targetmu mengalahkan yang lain. Detektif melihatmu Tidak Bersalah.","You are part of the Mafia. Each night, choose one player: they cannot speak during the next day. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, pilih satu pemain: dia tidak bisa bicara besok. Kamu juga ikut memilih target Mafia.","You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss.":"Kamu menang kalau warga mem-vote kamu keluar. Bertingkahlah mencurigakan, tapi jangan berlebihan. Mati di malam hari berarti kalah.","You win if you are alive when the game ends, whoever else wins. You have a limited number of bulletproof vests to use at night.":"Kamu menang kalau masih hidup saat permainan berakhir, siapa pun pemenangnya. Kamu punya rompi antipeluru terbatas untuk dipakai di malam hari.","On the first night, choose two players to fall in love (you may choose yourself). The lovers learn who each other is. If one lover dies, by night or by vote, the other dies of a broken heart.":"Di malam pertama, pilih dua pemain untuk saling jatuh cinta (boleh dirimu sendiri). Pasangan itu tahu siapa kekasihnya. Kalau salah satu mati, di malam hari atau karena vote, yang lain ikut mati patah hati.","You have no night action, but you are wired to blow. If the Mafia kills you, the blast takes one of them with you. If the town votes you out, the blast takes one of the players who voted for you.":"Kamu tidak punya aksi malam, tapi tubuhmu dipasangi bom. Kalau Mafia membunuhmu, ledakannya ikut menewaskan salah satu dari mereka. Kalau warga mem-vote kamu keluar, ledakannya menewaskan salah satu pemain yang memilihmu.","Each night, deliver fresh bread to another player. The whole town sees who got bread, and that player's vote counts double the next day. Feed the people you trust.":"Setiap malam, antarkan roti hangat ke pemain lain. Semua orang tahu siapa yang dapat roti, dan suara pemain itu dihitung dua kali besok. Beri makan orang yang kamu percaya.","Blood Moon":"Bulan Darah","Peaceful Night":"Malam Damai","Thick Fog":"Kabut Tebal","Town Elder":"Tetua Kota","Secret Ballot":"Pemungutan Rahasia","Short Fuse":"Sumbu Pendek","The Mafia is emboldened: every Mafia member may choose a separate target tonight.":"Mafia makin berani: setiap anggota Mafia boleh memilih target sendiri malam ini.","A strange calm falls over the town. No one can be killed tonight.":"Ketenangan aneh menyelimuti kota. Tidak ada yang bisa dibunuh malam ini.","Visibility is poor. The Detective receives no result tonight.":"Jarak pandang buruk. Detektif tidak mendapat hasil malam ini.","A randomly chosen player is named Town Elder: their vote counts twice today.":"Satu pemain acak dijadikan Tetua Kota: suaranya dihitung dua kali hari ini.","Votes are cast in secret today. Only totals are revealed.":"Hari ini voting dilakukan diam-diam. Hanya totalnya yang ditampilkan.","Tempers are high. Discussion time is halved today.":"Emosi memuncak. Waktu diskusi dipotong setengah hari ini.","{event}: {desc}":"{event}: {desc}",Map:"Peta",Random:"Acak",Village:"Desa",House:"Rumah",Hospital:"Rumah Sakit",Villa:"Vila","A different place every game.":"Tempat berbeda di setiap permainan.","A sleepy farming village with one road in and none out.":"Desa pertanian yang sepi. Ada satu jalan masuk, tak ada jalan keluar.","One big family house. Every door locks from the inside.":"Satu rumah keluarga besar. Semua pintu terkunci dari dalam.","A night shift at St. Agatha. The nurses see everything.":"Shift malam di RS St. Agatha. Para perawat melihat semuanya.","A private villa on a cliff. Champagne, secrets, no signal.":"Vila pribadi di tepi tebing. Sampanye, rahasia, tanpa sinyal.","The map decides where bodies are found and how each victim was killed.":"Peta menentukan di mana mayat ditemukan dan bagaimana korban dibunuh.","Crime scene · {map}":"TKP · {map}","Case file":"Berkas kasus","T.O.D.":"W.K.",Found:"Lokasi",Cause:"Penyebab",Clue:"Petunjuk","in {room}":"di {room}","the street":"jalanan","the town square":"alun-alun","the church bell tower":"menara lonceng gereja","the old well":"sumur tua","the barn":"lumbung","the windmill":"kincir angin","the cemetery":"pemakaman","the tavern cellar":"gudang bawah kedai","the riverbank":"tepi sungai","the kitchen":"dapur","the living room":"ruang tamu","the basement":"ruang bawah tanah","the attic":"loteng","the bathroom":"kamar mandi","the garden shed":"gudang kebun","the garage":"garasi","the staircase":"tangga","the emergency room":"IGD","the morgue":"kamar jenazah","the pharmacy":"apotek","the operating theatre":"ruang operasi","the nurse station":"pos perawat","the elevator":"lift","the rooftop":"atap gedung","the X-ray room":"ruang rontgen","the swimming pool":"kolam renang","the wine cellar": ari terdaftar","Resident no.":"NIK",Name:"Nama",Status:"Status",Issued:"Diterbitkan",Guest:"Tamu","Valid until":"Berlaku hingga",Signature:"Tanda tangan",Death:"Mati",Curfew:"Jam malam",Photo:"Foto","Pixelate my photo":"Jadikan fotoku piksel","Turns your photo into a pixel portrait":"Mengubah fotomu jadi potret piksel","Remove photo":"Hapus foto","Choose a portrait":"Pilih potret","Flip card: account":"Balik kartu: akun","Flip card: front":"Balik kartu: depan","Registered as":"Terdaftar sebagai","Sign in with this card on any device to keep your name, photo and history.":"Masuk dengan kartu ini di perangkat mana pun untuk menyimpan nama, foto, dan riwayatmu.","Sign in with your card":"Masuk dengan kartumu","Register this card":"Daftarkan kartu ini","You are asleep":"Kamu tertidur","The night goes on without you. Something moves in the dark.":"Malam terus berjalan tanpamu. Ada yang bergerak dalam gelap.","Dawn in":"Fajar dalam","Wake up":"Bangun","Killed in {room}. {method}":"Dibunuh di {room}. {method}","You did not survive the night.":"Kamu tidak selamat malam ini.","The town has executed you.":"Warga telah mengeksekusimu.","Clues found: {a}, {b}. One of them points to the Mafia.":"Petunjuk ditemukan: {a}, {b}. Salah satunya mengarah ke Mafia.","Clues found: {a}. One of them points to the Mafia.":"Petunjuk ditemukan: {a}. Petunjuk ini mengarah ke Mafia.","Host a private room on this device. Friends join with the code.":"Jadi host ruangan privat di perangkat ini. Teman bergabung pakai kode.","PEER LINK READY":"JALUR PEER SIAP","Rooms run on the host’s device. The host keeps the game open and the screen on; everyone needs internet to connect. Works best on the same Wi-Fi.":"Ruangan berjalan di perangkat host. Host harus membiarkan game tetap terbuka dan layar menyala; semua perangkat butuh internet untuk tersambung. Paling lancar di WiFi yang sama.","Connecting to the host…":"Menyambung ke host…","You are the host. Leaving closes the room for everyone.":"Kamu host-nya. Kalau keluar, ruangan ditutup untuk semua orang.","This device is the host: the game runs here. Keep this page open and the screen on until the game ends. Share the code so friends can join.":"Perangkat ini adalah host: game berjalan di sini. Biarkan halaman ini terbuka dan layar tetap menyala sampai game selesai. Bagikan kodenya supaya teman bisa bergabung.","Connected to the host’s device. If the connection drops, the game reconnects automatically.":"Tersambung ke perangkat host. Kalau koneksi putus, game menyambung lagi otomatis.","Restoring your room…":"Memulihkan ruanganmu…","Could not reach the connection service. Check your internet and try again.":"Tidak bisa menghubungi layanan koneksi. Cek internetmu lalu coba lagi.","Could not create the room. Try again.":"Ruangan gagal dibuat. Coba lagi.","Room not found. Check the code and make sure the host still has the game open.":"Ruangan tidak ditemukan. Cek kodenya dan pastikan host masih membuka game-nya.","Lost the connection to the host.":"Koneksi ke host terputus.","The host closed the room.":"Host menutup ruangan.","This needs the online server version of Nightfall.":"Fitur ini butuh versi server online Nightfall.","Say hello first.":"Sambungan belum siap.","Creating room…":"Membuat ruangan…","Could not reach the connection service. Open the game from its website link in Safari or Chrome (not a file preview), check your internet, and try again.":"Tidak bisa menghubungi layanan koneksi. Buka game dari link website-nya di Safari atau Chrome (bukan preview file), cek internetmu, lalu coba lagi.","Playing across phones needs the website link (https://…) opened in Safari or Chrome. File previews and chat-app viewers block the connection. Pass & play still works here.":"Main antar-HP butuh link website (https://…) yang dibuka di Safari atau Chrome. Preview file dan penampil di aplikasi chat memblokir koneksinya. Main oper-HP tetap bisa di sini.","Silence a player. Not on night 1; once every 3 nights.":"Bungkam satu pemain. Tidak di malam 1; sekali tiap 3 malam.","You are part of the Mafia. From the second night, you can silence one player for the next day, then you must wait three nights before silencing again. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Mulai malam kedua, kamu bisa membungkam satu pemain untuk hari berikutnya, lalu harus menunggu tiga malam sebelum bisa membungkam lagi. Kamu juga ikut memilih target Mafia.",Mayor:"Wali Kota","Your vote counts twice, every other day.":"Suaramu dihitung dua kali, selang sehari.","You lead the town. On odd-numbered days (day 1, 3, 5…) your vote counts twice. On even days it recharges and counts once.":"Kamu pemimpin kota. Di hari ganjil (hari 1, 3, 5…) suaramu dihitung dua kali. Di hari genap suaramu mengisi ulang dan dihitung sekali.",Hacker:"Peretas","Scramble the information around one player.":"Kacaukan informasi di sekitar satu pemain.","You are part of the Mafia. Each night, hack one player. Any investigation they make, and any investigation made on them, returns corrupted results tonight. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, retas satu pemain. Semua penyelidikan yang dia lakukan, dan semua penyelidikan terhadap dirinya, memberi hasil rusak malam ini. Kamu juga ikut memilih target Mafia.",Locksmith:"Tukang Kunci","Lock one player’s ability for the night.":"Kunci kemampuan satu pemain untuk malam ini.","Each night, lock one player. Whatever ability they have does nothing tonight, including a Mafia member’s vote on who dies. Locking someone with no ability has no effect.":"Setiap malam, kunci satu pemain. Kemampuan apa pun yang dia punya tidak berfungsi malam ini, termasuk suara anggota Mafia soal siapa yang dibunuh. Mengunci orang tanpa kemampuan tidak berefek apa-apa.",Oracle:"Peramal","Learn one player’s identity, a little more each night.":"Ketahui identitas satu pemain, sedikit demi sedikit tiap malam.","Each night, study one player. Night one reveals whether they act at night, the next reveals their team, the third reveals their exact role. Switching to someone else starts over.":"Setiap malam, amati satu pemain. Malam pertama mengungkap apakah dia beraksi di malam hari, berikutnya timnya, dan yang ketiga peran persisnya. Ganti orang berarti mulai dari awal.",Gambler:"Penjudi","Guess roles. Win big or pay the price.":"Tebak peran. Menang besar atau tanggung akibatnya.","Each night, guess one player’s role. Guess right and you earn a lucky charm that survives one attack. Guess wrong and you lose your vote the next day. You win if you are alive at the end with at least one correct guess.":"Setiap malam, tebak peran satu pemain. Tebakan benar memberimu jimat keberuntungan yang menahan satu serangan. Tebakan salah membuatmu kehilangan hak suara besok. Kamu menang kalau masih hidup di akhir dengan minimal satu tebakan benar.",Lightkeeper:"Penjaga Mercusuar","Shield one player from locks and hacks.":"Lindungi satu pemain dari kunci dan retasan.","Only in games with a Locksmith. Each night, shine your light on one player: they cannot be locked or hacked tonight, and you learn whether anyone tried.":"Hanya ada kalau ada Tukang Kunci. Setiap malam, sorot satu pemain dengan cahayamu: dia tidak bisa dikunci atau diretas malam ini, dan kamu tahu apakah ada yang mencoba.",Shapeshifter:"Pengubah Wujud","Disguise yourself as another player at night.":"Menyamar jadi pemain lain di malam hari.","You are part of the Mafia. Each night, take another player’s shape: anyone investigating you tonight sees that player’s identity instead of yours. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, ambil wujud pemain lain: siapa pun yang menyelidikimu malam ini melihat identitas orang itu, bukan identitasmu. Kamu juga ikut memilih target Mafia.",Medium:"Medium","Talk with the dead at night.":"Bicara dengan arwah di malam hari.","At night you can hear and speak with the spirits of the dead. Ask them what they saw before they died.":"Di malam hari kamu bisa mendengar dan berbicara dengan arwah orang mati. Tanyakan apa yang mereka lihat sebelum mati.",Witness:"Saksi","If you are murdered, you see your killer.":"Kalau kamu dibunuh, kamu melihat pembunuhmu.","If the Mafia kills you at night, you see who did it in your last moment. Use your last words well.":"Kalau Mafia membunuhmu di malam hari, di detik terakhir kamu melihat siapa pelakunya. Manfaatkan pesan terakhirmu baik-baik.",Retributionist:"Pembalas","Take a dead player’s power, once, for good.":"Ambil kekuatan pemain yang sudah mati, sekali, selamanya.","Once per game, choose a dead player whose power you want. From the next night you use that ability as your own until you die.":"Sekali dalam permainan, pilih pemain mati yang kekuatannya kamu mau. Mulai malam berikutnya kamu memakai kemampuan itu sebagai milikmu sampai kamu mati.","Choose where the victim dies and with what. The deciding vote picks the scene.":"Pilih di mana korban mati dan dengan apa. Suara penentu yang memilih TKP-nya.","Investigations by or about this player return corrupted results tonight.":"Penyelidikan oleh atau terhadap pemain ini memberi hasil rusak malam ini.","Their ability does nothing tonight. Locking someone with no ability has no effect.":"Kemampuannya tidak berfungsi malam ini. Mengunci orang tanpa kemampuan tidak berefek.","No dead player has a power you can take yet.":"Belum ada pemain mati yang kekuatannya bisa kamu ambil.","The dead can hear you tonight. Speak with them in the graveyard chat.":"Para arwah bisa mendengarmu malam ini. Bicaralah dengan mereka di chat kuburan.","They cannot be locked or hacked tonight. You will learn if anyone tried.":"Dia tidak bisa dikunci atau diretas malam ini. Kamu akan tahu kalau ada yang mencoba.","If you are murdered tonight, you will see who did it.":"Kalau kamu dibunuh malam ini, kamu akan melihat pelakunya.","Anyone investigating you tonight sees this player instead.":"Siapa pun yang menyelidikimu malam ini akan melihat pemain ini.","Choose a player to study. Each night on the same player reveals more.":"Pilih pemain untuk diamati. Tiap malam pada orang yang sama mengungkap lebih banyak.","Studying {name}: vision {a} of 3. Choose them again to see more, or start over with someone new.":"Mengamati {name}: penglihatan {a} dari 3. Pilih dia lagi untuk melihat lebih jauh, atau mulai ulang dengan orang lain.","You locked {name} in for the night.":"Kamu mengunci {name} semalaman.","Your light watched over {name}. Nobody tried to tamper with them.":"Cahayamu menjaga {name}. Tidak ada yang mencoba mengganggunya.","Someone tried to tamper with {name}, but your light kept them safe.":"Ada yang mencoba mengganggu {name}, tapi cahayamu melindunginya.","Your door was locked tonight. Your ability did nothing.":"Pintumu dikunci malam ini. Kemampuanmu tidak berfungsi.","Vision: {name} acts at night.":"Penglihatan: {name} beraksi di malam hari.","Vision: {name} does not act at night.":"Penglihatan: {name} tidak beraksi di malam hari.","Vision: {name} is on the {team} team.":"Penglihatan: {name} ada di tim {team}.","Vision: {name} is the {role}.":"Penglihatan: {name} adalah {role}.","Bad bet: {name} is not the {role}. You lose your vote today.":"Taruhan kalah: {name} bukan {role}. Kamu kehilangan hak suara hari ini.","Your bet paid off: {name} is the {role}. You earned a lucky charm.":"Taruhanmu menang: {name} adalah {role}. Kamu dapat jimat keberuntungan.","Your lucky charm saved you tonight!":"Jimat keberuntunganmu menyelamatkanmu malam ini!","You took {name}'s power. From tomorrow night you also have the {role}’s power.":"Kamu mengambil kekuatan {name}. Mulai besok malam kamu juga punya kekuatan {role}.","Once per game: take this dead player’s power. You keep it until you die.":"Sekali per permainan: ambil kekuatan pemain mati ini. Kekuatan itu milikmu sampai kamu mati.","With your last breath you saw your killer: {name}.":"Dengan napas terakhirmu kamu melihat pembunuhmu: {name}.","You can silence from the second night.":"Kamu baru bisa membungkam mulai malam kedua.","After this, your power recharges for three nights.":"Setelah ini, kekuatanmu mengisi ulang selama tiga malam.","Recharging: you can silence again on night {n}.":"Mengisi ulang: kamu bisa membungkam lagi di malam {n}.",'ID check: the card "{word}" belongs to {name}.':'Cek KTP: kartu "{word}" milik {name}.',"The Lightkeeper needs a Locksmith in the game.":"Penjaga Mercusuar butuh Tukang Kunci di dalam permainan.","The Medium can only reach the dead at night.":"Medium hanya bisa menghubungi arwah di malam hari.","Invalid guess.":"Tebakan tidak valid.","Invalid choice.":"Pilihan tidak valid.","There is no evidence to check right now.":"Belum ada bukti yang bisa dicek sekarang.","There is no such card.":"Kartu itu tidak ada.","No ID checks left today.":"Jatah cek KTP hari ini sudah habis.","You lost your vote on a bad bet.":"Kamu kehilangan hak suara karena kalah taruhan.","Not in this room.":"Kamu tidak ada di ruangan ini.","{name} is under your protection tonight.":"{name} ada dalam perlindunganmu malam ini.","Your shield stands before {name}.":"Perisaimu berdiri di depan {name}.","{name} is marked for death.":"{name} ditandai untuk mati.","{name} is in your sights.":"{name} ada dalam bidikanmu.","You tail {name} through the dark. The file arrives at dawn.":"Kamu membuntuti {name} dalam gelap. Berkasnya tiba saat fajar.","{name} will wake with a taped mouth.":"{name} akan bangun dengan mulut terlakban.","Your arrow binds two hearts.":"Panahmu mengikat dua hati.","Fresh bread for {name} at dawn.":"Roti hangat untuk {name} saat fajar.","{name}’s signal is yours tonight.":"Sinyal {name} milikmu malam ini.","{name}’s door is locked until morning.":"Pintu {name} terkunci sampai pagi.","Your light falls on {name}.":"Cahayamu jatuh pada {name}.","Your vision turns to {name}.":"Penglihatanmu tertuju pada {name}.","The dice are rolling on {name}.":"Dadu bergulir untuk {name}.","Tonight you wear {name}’s face.":"Malam ini kamu memakai wajah {name}.","{name}’s power flows into you.":"Kekuatan {name} mengalir ke dalam dirimu.","You strap on a vest.":"Kamu memakai rompi.","Auto-balance only sets these. Everyone else is a Citizen unless you add special roles below.":"Seimbangkan otomatis hanya mengatur ini. Sisanya jadi Warga, kecuali kamu menambah peran spesial di bawah.","{n} added":"{n} ditambahkan","Never added automatically. Pick the ones you want for this game.":"Tidak pernah ditambahkan otomatis. Pilih sendiri yang kamu mau untuk game ini.","Add a Locksmith first.":"Tambahkan Tukang Kunci dulu.","Core roles":"Peran inti","Special roles":"Peran spesial","Secret voting":"Voting rahasia","Nobody sees who voted for whom, only the totals":"Tidak ada yang tahu siapa memilih siapa, hanya jumlahnya","Mafia picks place & weapon":"Mafia memilih tempat & senjata","The killers choose where and how the victim dies":"Pembunuh memilih di mana dan bagaimana korban mati","Background check":"Pemeriksaan latar","Checking…":"Memeriksa…","ID checks left: {n}":"Sisa cek KTP: {n}","Check ID":"Cek KTP","Your private report":"Laporan rahasiamu","Correct guesses: {n}":"Tebakan benar: {n}","Lucky charms: {n}":"Jimat: {n}","Taken power: {role}":"Kekuatan diambil: {role}","Only {name} can read this":"Hanya {name} yang bisa membaca ini",Chosen:"Dipilih",Where:"Di mana",How:"Dengan apa","Leave it to fate":"Serahkan pada nasib","Bet placed":"Taruhan dipasang","1 · Who?":"1 · Siapa?","2 · Which role?":"2 · Peran apa?","No bet tonight":"Tidak bertaruh malam ini","Choose the place and the weapon":"Pilih tempat dan senjata","Hack a player":"Retas seorang pemain","Lock a door":"Kunci sebuah pintu","Study a player":"Amati seorang pemain","Place your bet":"Pasang taruhanmu","Shine your light":"Sorotkan cahayamu","Take someone’s shape":"Ambil wujud seseorang","Take a dead player’s power":"Ambil kekuatan pemain yang mati","Lovers’ whisper":"Bisikan kekasih","Séance: the dead are listening":"Pemanggilan arwah: para arwah mendengarkan",Died:"Mati","Mayor: your vote counts double today.":"Wali Kota: suaramu dihitung dua kali hari ini.","to read their private morning report":"untuk membaca laporan pagi rahasianya","Morning, {name}":"Pagi, {name}","Nothing unusual happened to you last night.":"Tidak ada yang aneh terjadi padamu semalam.","Done, hide it":"Selesai, sembunyikan",Remove:"Hapus","Before you enter room {code}, fill in your resident card. Everyone at the table will see this name and photo.":"Sebelum masuk ruangan {code}, isi dulu kartu pendudukmu. Semua pemain akan melihat nama dan foto ini.","Before you open a room, fill in your resident card. Everyone at the table will see this name and photo.":"Sebelum membuka ruangan, isi dulu kartu pendudukmu. Semua pemain akan melihat nama dan foto ini.","Save & join":"Simpan & gabung","Save & continue":"Simpan & lanjut","Who are you?":"Siapa kamu?","secret ballot":"voting rahasia",Suspicious:"Mencurigakan",Innocent:"Tidak bersalah","Correct guesses: {a}. Lucky charms: {b}. A wrong guess costs your vote tomorrow.":"Tebakan benar: {a}. Jimat: {b}. Tebakan salah membuatmu kehilangan suara besok.","You are dead. Watch quietly and keep the secrets.":"Kamu sudah mati. Tonton diam-diam dan jaga rahasianya.","Tap your card to see your secret role. Do not show anyone.":"Ketuk kartumu untuk melihat peran rahasiamu. Jangan tunjukkan ke siapa pun.","Night: pass the device as shown.":"Malam: oper HP sesuai petunjuk.","Make your secret move below, then wait for dawn.":"Lakukan aksi rahasiamu di bawah, lalu tunggu fajar.","Your part is done. Wait for dawn.":"Bagianmu selesai. Tunggu fajar.","Morning news: see who survived the night.":"Kabar pagi: lihat siapa yang selamat semalam.","Introduce yourselves. Tap “Start the first night” when everyone is ready.":"Kenalan dulu. Ketuk “Mulai malam pertama” kalau semua sudah siap.","Introduce yourselves and read your role guide. Night falls when the timer ends.":"Kenalan dulu dan baca panduan peranmu. Malam tiba saat waktu habis.","Discuss who the Mafia might be, then open the vote.":"Diskusikan siapa kira-kira Mafia, lalu buka voting.","Discuss who the Mafia might be. The vote opens when the timer ends.":"Diskusikan siapa kira-kira Mafia. Voting dibuka saat waktu habis.","Vote: tap a voter, then their choice.":"Voting: ketuk pemilih, lalu pilihannya.","Vote for the player you think is Mafia.":"Vote pemain yang menurutmu Mafia.","Vote cast. You can change it until everyone has voted.":"Suara masuk. Kamu masih bisa menggantinya sampai semua selesai vote.","You are on trial. Defend yourself!":"Kamu sedang diadili. Bela dirimu!","Listen to the accused defend themselves.":"Dengarkan pembelaan si tertuduh.","Decide: guilty or not guilty?":"Putuskan: bersalah atau tidak?","The verdict is in.":"Putusan sudah keluar.","Day cycle":"Siklus hari",Discuss:"Diskusi",Vote:"Vote","At night":"Saat malam","During the day":"Saat siang","How you win":"Cara menang","How to play: {role}":"Cara main: {role}","Tap a role to see how it plays.":"Ketuk peran untuk melihat cara mainnya.","First morning":"Pagi pertama","Nobody has died yet. Get to know the town.":"Belum ada yang mati. Kenali dulu warga kota.","Someone in this town is Mafia. Nobody knows who, except the Mafia themselves.":"Ada Mafia di kota ini. Tidak ada yang tahu siapa, kecuali Mafia sendiri.","Introduce yourself and act natural. Watch how people talk.":"Perkenalkan dirimu dan bersikap biasa. Perhatikan cara orang bicara.","Tonight everyone sleeps and the special roles act. Tomorrow you find out who died, discuss, and vote.":"Malam ini semua tidur dan peran khusus beraksi. Besok kalian tahu siapa yang mati, berdiskusi, lalu voting.","Start the first night":"Mulai malam pertama","Welcome to Nightfall":"Selamat datang di Nightfall","Roles in this game":"Peran di game ini","One day in Nightfall":"Satu hari di Nightfall","wins if alive at the end with one correct guess.":"menang kalau masih eran aslinya dan tim mana yang membunuhnya, walaupun mayatnya sudah dibersihkan.",Tracker:"Pelacak","Follow a player and see where they go.":"Ikuti satu pemain dan lihat ke mana dia pergi.","Each night, follow one player. At dawn you learn who they visited, or that they stayed home.":"Setiap malam, ikuti satu pemain. Saat fajar kamu tahu siapa yang dia datangi, atau dia diam di rumah.",Spy:"Mata-mata","Eavesdrop on the Mafia’s chat.":"Menyadap chat Mafia.","You can read the Mafia’s night chat, but the line is bad: names are hidden and some words are lost. You cannot write in it.":"Kamu bisa membaca chat malam Mafia, tapi sinyalnya jelek: nama disamarkan dan sebagian kata hilang. Kamu tidak bisa menulis di sana.",Executioner:"Algojo","Get your target voted out.":"Bikin targetmu di-vote keluar.","You are given one target from the town. You win if the town votes them out. If they die any other way, you become a Jester.":"Kamu diberi satu target dari warga. Kamu menang kalau warga mem-vote dia keluar. Kalau dia mati dengan cara lain, kamu jadi Badut.",Veteran:"Veteran","Go on alert and shoot every visitor.":"Siaga dan tembak setiap tamu.","Twice per game, go on alert for the night. Anyone who visits you that night is shot dead, friend or foe, and you cannot be killed while on alert.":"Dua kali per game, siaga semalaman. Siapa pun yang mendatangimu malam itu ditembak mati, kawan atau lawan, dan kamu tidak bisa dibunuh selama siaga.",Journalist:"Jurnalis","Publish one player’s role to everyone.":"Umumkan peran satu pemain ke semua orang.","Once per game, investigate one player at night. The next morning, their role is printed in the paper for the whole town to read.":"Sekali per game, selidiki satu pemain di malam hari. Paginya, perannya dimuat di koran untuk dibaca seluruh kota.",Twin:"Kembar","You know your twin is innocent.":"Kamu tahu kembaranmu tidak bersalah.","There are always two Twins. You know who your twin is, and both of you are Town. Trust each other.":"Kembar selalu ada dua. Kamu tahu siapa kembaranmu, dan kalian berdua Warga. Saling percayalah.","Security Guard":"Penjaga CCTV","Watch one room on CCTV.":"Pantau satu ruangan lewat CCTV.","Realistic mode only. Each night, watch one room through its camera. At dawn you see who hid there, who came in, what happened, and where the footprints lead.":"Hanya di mode realistis. Setiap malam, pantau satu ruangan lewat kameranya. Saat fajar kamu lihat siapa yang sembunyi di sana, siapa yang masuk, apa yang terjadi, dan ke mana jejak kakinya.","Pick a room to hide in tonight. Everyone hides, the Mafia too. If you do not choose, you end up somewhere at random.":"Pilih ruangan untuk sembunyi malam ini. Semua sembunyi, Mafia juga. Kalau tidak memilih, kamu ditempatkan secara acak.","{n} alerts left. On alert you shoot every visitor, friend or foe.":"Sisa siaga: {n}. Saat siaga kamu menembak setiap tamu, kawan atau lawan.","{n} alert left. On alert you shoot every visitor, friend or foe.":"Sisa siaga: {n}. Saat siaga kamu menembak setiap tamu, kawan atau lawan.","Follow a player. At dawn you learn who they visited.":"Ikuti satu pemain. Saat fajar kamu tahu siapa yang dia datangi.","No bodies to examine yet.":"Belum ada mayat untuk diperiksa.","Choose your victim. The Mafia cannot kill you at night.":"Pilih korbanmu. Mafia tidak bisa membunuhmu di malam hari.","Choose a room to raid. If nobody is hiding there, the hunt fails and one of you may die (most likely the one who made the call).":"Pilih ruangan untuk digerebek. Kalau tidak ada yang sembunyi di sana, perburuan gagal dan salah satu dari kalian bisa mati (paling mungkin yang memilih ruangannya).","Choose a room to raid. If nobody is hiding there, the hunt fails.":"Pilih ruangan untuk digerebek. Kalau tidak ada yang sembunyi di sana, perburuan gagal.","Once per game: clean tonight’s victim. Their role stays secret and the scene is wiped.":"Sekali per game: bersihkan korban malam ini. Perannya tetap rahasia dan TKP-nya dihapus.","Y gnal restored":"Sinyal kembali",Vibration:"Getar","Buzz on taps and big moments (Android phones)":"Getar saat mengetuk dan momen penting (HP Android)","The raid on {room} found nobody, but footprints led to {other}.":"Penggerebekan di {room} tidak menemukan siapa pun, tapi jejak kaki mengarah ke {other}.","Quick setup":"Atur cepat",Classic:"Klasik",Fun:"Seru",Chaos:"Kacau","Realistic CCTV":"Realistis CCTV","Mafia, Detective, Doctor and citizens. Best for first games.":"Mafia, Detektif, Dokter dan warga. Paling pas untuk game pertama.","A few well-known special roles on top of the classic set.":"Beberapa peran spesial populer di atas set klasik.","Lots of special roles. Expect surprises every night.":"Banyak peran spesial. Siap-siap kejutan tiap malam.","Hide in rooms, raids, and a Security Guard on the cameras.":"Sembunyi di ruangan, penggerebekan, dan Penjaga CCTV di kamera.","Different special roles every game.":"Peran spesial berbeda setiap game.","Tap a preset, then fine-tune below if you like.":"Ketuk salah satu preset, lalu atur detailnya di bawah kalau mau.","The sentence":"Hukuman","The town led them to the gallows.":"Warga menggiringnya ke tiang gantungan.","They were thrown out into the storm.":"Dia dilempar keluar ke tengah badai.","The sentence was carried out quietly.":"Hukuman dijalankan dalam diam.","They were pushed over the cliff edge.":"Dia didorong dari tepi tebing.","It was the Jester all along. They wanted this!":"Ternyata dia Badut. Ini yang dia mau!","They were a Bomb, and took someone with them.":"Dia ternyata Bom, dan membawa seseorang ikut mati.","Somewhere, a lover’s heart breaks.":"Di suatu tempat, hati seorang kekasih hancur.","Practice vs bots":"Latihan lawan bot","Learn the game alone against bots.":"Belajar main sendirian melawan bot.","Play a full game against bots on this device. Great for learning the roles before playing with friends.":"Main satu game penuh melawan bot di perangkat ini. Cocok untuk belajar peran sebelum main bareng teman.",Table:"Meja",Bots:"Bot","{n} players in total, including you.":"Total {n} pemain, termasuk kamu.","Start practice":"Mulai latihan",Confirm:"Konfirmasi","I'm just a citizen, I swear.":"Aku cuma warga biasa, sumpah.","{name} has been very quiet. Suspicious.":"{name} diem aja dari tadi. Mencurigakan.","I trust {name} for now.":"Untuk sekarang aku percaya {name}.","Who did the Mafia go after last night? That tells us something.":"Mafia ngincer siapa semalam? Itu petunjuk loh.","{name}, where were you last night?":"{name}, semalam kamu di mana?","Let's not vote randomly, please.":"Tolong jangan vote asal ya.","I'm a citizen. {name} is acting weird though.":"Aku warga. Tapi {name} aneh banget.","I don't trust {name} at all.":"Aku sama sekali nggak percaya {name}.","We should vote {name}, trust me.":"Kita vote {name} aja, percaya deh.","Honestly I have no idea. Maybe {name}?":"Jujur aku nggak tahu. Mungkin {name}?","I'm the Detective. {name} is SUSPICIOUS. Vote them!":"Aku Detektif. {name} MENCURIGAKAN. Vote dia!","I checked {name} last night. Innocent.":"Semalam aku cek {name}. Tidak bersalah.","The host disconnected. Your device is taking over the room…":"Host terputus. Perangkatmu sedang mengambil alih ruangan…","You are the new host. Keep this page open.":"Kamu host yang baru. Biarkan halaman ini tetap terbuka.","Another player is hosting the room now. Rejoining as a player…":"Pemain lain sekarang jadi host. Bergabung lagi sebagai pemain…","Lone Mafia bonus: when only one Mafia is left and fewer than 10 players are alive, they roll for extra rooms each night (2 to 5 rooms, or a rare jackpot to pick anyone). The smaller the town, the better the odds.":"Bonus Mafia tunggal: kalau Mafia tinggal satu dan pemain hidup kurang dari 10, tiap malam dia mengocok jatah ruangan (2 sampai 5 ruangan, atau jackpot langka untuk langsung memilih siapa saja). Makin sedikit orang, makin besar peluangnya.","Lucky night: you may raid up to {n} rooms. If you find several people, you still take only one.":"Malam beruntung: kamu boleh menggerebek sampai {n} ruangan. Kalau ketemu beberapa orang, kamu tetap cuma mengambil satu.","Jackpot: tonight you can find anyone. Pick your victim directly.":"Jackpot: malam ini kamu bisa menemukan siapa saja. Pilih korbanmu langsung.","The town is small and scared. Tonight you can find anyone: pick your victim directly.":"Kota makin sepi dan ketakutan. Malam ini kamu bisa menemukan siapa saja: pilih korbanmu langsung.","The town is small and scared. Tonight you can raid {n} rooms.":"Kota makin sepi dan ketakutan. Malam ini kamu bisa menggerebek {n} ruangan.","The figure looks around and moves on.":"Sosok itu melihat sekeliling lalu pergi.","Lucky night":"Malam beruntung","You can raid up to {n} rooms tonight. You still take only one victim.":"Malam ini kamu bisa menggerebek sampai {n} ruangan. Korbannya tetap cuma satu.","Rolling…":"Mengocok…","{a} of {b} rooms chosen":"{a} dari {b} ruangan dipilih","{n} rooms":"{n} ruangan","ERROR: signal jammed. Your power does not work tonight.":"ERROR: sinyal diacak. Kekuatanmu tidak berfungsi malam ini.","ERROR: your protection failed tonight. Something went wrong.":"ERROR: perlindunganmu gagal malam ini. Ada yang tidak beres.","ERROR: data corrupted. Whatever you found tonight is lost.":"ERROR: data rusak. Apa pun yang kamu temukan malam ini hilang.","SIGNAL JAMMED":"SINYAL DIACAK","DATA CORRUPTED":"DATA RUSAK","interference detected":"gangguan terdeteksi","Signal interference":"Gangguan sinyal","Town powers sometimes get jammed (can't act) or come back corrupted (result lost). Balances realistic mode.":"Kekuatan warga kadang diacak (tidak bisa dipakai) atau hasilnya rusak (hilang). Menyeimbangkan mode realistis.","Hack the town: BUFF the Mafia or NERF the town.":"Retas kota: BUFF Mafia atau NERF warga.","You are part of the Mafia. Every other night (1, 3, 5…) you crack a puzzle and launch a hack that runs the following night: BUFF gives the Mafia extra rooms to raid or a chance at a second victim; NERF scrambles the town’s maps and jams their powers. Each hack works 3 times out of 4. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Selang semalam (malam 1, 3, 5…) kamu memecahkan teka-teki lalu meluncurkan retasan yang berjalan malam berikutnya: BUFF memberi Mafia ruangan gerebek tambahan atau peluang korban kedua; NERF mengacak denah warga dan mengganggu kekuatan mereka. Tiap retasan berhasil 3 dari 4 kali. Kamu juga ikut memilih target Mafia.","Crack the system, then choose BUFF (help the Mafia) or NERF (break the town). It works 3 times out of 4 and kicks in tomorrow night.":"Bobol sistemnya, lalu pilih BUFF (bantu Mafia) atau NERF (rusak warga). Berhasil 3 dari 4 kali dan aktif besok malam.","Recharging: you can hack again tomorrow night.":"Mengisi ulang: kamu bisa meretas lagi besok malam.","Hack failed: the firewall held. Try again in two nights.":"Retasan gagal: firewall bertahan. Coba lagi dua malam lagi.","Hack successful: {mode} will run tomorrow night.":"Retasan berhasil: {mode} akan berjalan besok malam.","HACK LIVE: BUFF. The Mafia has the upper hand tonight.":"RETASAN AKTIF: BUFF. Mafia di atas angin malam ini.","HACK LIVE: NERF. The town’s systems are going haywire tonight.":"RETASAN AKTIF: NERF. Sistem warga kacau malam ini.","Your {mode} hack is running tonight. You can hack again tomorrow night.":"Retasan {mode}-mu berjalan malam ini. Kamu bisa meretas lagi besok malam.","The hack paid off: the town’s alarms stayed silent and you took a second victim.":"Retasannya berhasil: alarm warga diam dan kamu dapat korban kedua.","HACKED: your map is scrambled. You will hide somewhere at random tonight.":"DIRETAS: denahmu diacak. Malam ini kamu akan sembunyi di tempat acak.","Launch a hack":"Luncurkan retasan",Uploaded:"Terunggah","Breach protocol":"Protokol pembobolan","errors {n}/3":"kesalahan {n}/3",sequence:"urutan","Access granted":"Akses diterima","Tap the codes in the order shown. Three mistakes and the grid reshuffles.":"Ketuk kode sesuai urutan. Tiga kali salah, kisinya diacak ulang.","Better odds for extra rooms to raid tomorrow night.":"Peluang ruangan gerebek tambahan lebih besar besok malam.","With a big town: a chance to raid 2-4 rooms.":"Kalau kotanya ramai: peluang menggerebek 2-4 ruangan.","15-30% chance to take a second victim tomorrow night.":"Peluang 15-30% dapat korban kedua besok malam.","The Detective gets overwhelmed: results may be lost.":"Detektif kewalahan: hasilnya bisa hilang.","Most of the town cannot pick where to hide: they end up anywhere.":"Sebagian besar warga tidak bisa memilih tempat sembunyi: mereka ditempatkan sembarang.","Town powers jam and glitch far more often.":"Kekuatan warga jauh lebih sering macet dan error.","Town powers jam and glitch 15-30% of the time.":"Kekuatan warga macet dan error 15-30% dari waktu.","Results come back corrupted.":"Hasilnya kembali dalam keadaan rusak.",uploaded:"terunggah","Works 3 times out of 4. The hack runs tomorrow night; tomorrow you recharge.":"Berhasil 3 dari 4 kali. Retasan berjalan besok malam; besok kamu mengisi ulang.","System breached":"Sistem dibobol","Hack live tonight: {mode}":"Retasan aktif malam ini: {mode}","Hack queued for tomorrow night: {mode}":"Retasan siap untuk besok malam: {mode}","Payload uploaded. It runs tomorrow night.":"Muatan terunggah. Berjalan besok malam.","Opening night: nobody knows where to hide yet. You may raid every room.":"Malam pembuka: belum ada yang tahu harus sembunyi di mana. Kamu boleh menggerebek semua ruangan.","Opening night: you may raid every room. If you find several people, you still take only one.":"Malam pembuka: kamu boleh menggerebek semua ruangan. Kalau ketemu beberapa orang, kamu tetap cuma mengambil satu.","Opening night":"Malam pembuka","Nobody knows where to hide yet: raid every room if you like. You still take only one victim.":"Belum ada yang tahu harus sembunyi di mana: gerebek semua ruangan kalau mau. Korbannya tetap cuma satu.","Raid every room":"Gerebek semua","Or stake out a house instead: learn everyone who visits it tonight. One time in three you are spotted.":"Atau intai sebuah rumah: kamu tahu siapa saja yang datang ke sana malam ini. Satu dari tiga kali kamu ketahuan.","Or stake out a room instead: see the true role of everyone hiding there. One time in three you are spotted.":"Atau intai sebuah ruangan: kamu lihat peran asli semua yang sembunyi di sana. Satu dari tiga kali kamu ketahuan.","Once per game: emergency surgery on someone who died last night. Half the time they come back. If it fails, the Mafia learns who you are. You protect nobody tonight if you operate.":"Sekali per game: operasi darurat untuk orang yang mati semalam. Setengah kemungkinan dia hidup lagi. Kalau gagal, Mafia tahu siapa kamu. Kalau mengoperasi, malam ini kamu tidak melindungi siapa pun.","You spotted someone watching: {name} is the Detective.":"Kalian memergoki seseorang mengintai: {name} adalah Detektif.","You think you were spotted during your stakeout.":"Sepertinya kamu ketahuan saat mengintai.","CLEAN tonight’s victim (role hidden, scene wiped) or PLANT evidence on an innocent. Then you rest for two nights. One time in four you leave a stain.":"BERSIHKAN korban malam ini (peran tersembunyi, TKP dihapus) atau TANAM BUKTI ke orang tak bersalah. Lalu kamu istirahat dua malam. Satu dari empat kali ada noda tertinggal.","Your kit is drying out. You can work again on night {n}.":"Peralatanmu masih dijemur. Kamu bisa bekerja lagi di malam {n}.","Or REPAIR the network instead of watching: half the glitches tonight and tomorrow, and a coin flip to block a NERF hack. Your cameras are off while you work.":"Atau PERBAIKI jaringan, bukan memantau: gangguan berkurang setengah malam ini dan besok, plus 50% peluang memblokir retasan NERF. Kameramu mati selama kamu bekerja.","You planted evidence pointing at {name}.":"Kamu menanam bukti yang mengarah ke {name}.","You repaired the network. Glitches are halved tonight and tomorrow.":"Kamu memperbaiki jaringan. Gangguan berkurang setengah malam ini dan besok.","You repaired the network and blocked an incoming hack!":"Kamu memperbaiki jaringan dan memblokir retasan yang akan masuk!","Your NERF hack was blocked: someone repaired the network.":"Retasan NERF-mu diblokir: ada yang memperbaiki jaringan.","Once per game: put a contract on someone. If the town votes them out tomorrow, the Mafia is rewarded the next night. Three times in ten you leave your gold ring at the scene.":"Sekali per game: pasang kontrak pada seseorang. Kalau warga mem-vote dia keluar besok, Mafia dapat hadiah malam berikutnya. Tiga dari sepuluh kali cincin emasmu tertinggal di TKP.","Contract placed on {name}. If the town votes them out tomorrow, you are rewarded the next night.":"Kontrak dipasang pada {name}. Kalau warga mem-vote dia keluar besok, kalian dapat hadiah malam berikutnya.","The surgery worked. {name} is breathing again.":"Operasinya berhasil. {name} bernapas lagi.","A miracle! {name} has been brought back to life.":"Keajaiban! {name} hidup kembali.","The surgery on {name} failed. You were seen leaving the morgue.":"Operasi {name} gagal. Kamu terlihat keluar dari kamar jenazah.","Someone tried to bring {name} back and failed: the Doctor is {doc}.":"Seseorang mencoba menghidupkan {name} dan gagal: Dokternya adalah {doc}.","Someone was watching from {room} last night.":"Semalam ada yang mengintai dari {room}.","The contract on {name} is fulfilled. Tomorrow night the Mafia is rewarded.":"Kontrak atas {name} terpenuhi. Besok malam Mafia dapat hadiah.","The contract paid off: tonight you can find anyone. Pick your victim directly.":"Kontraknya terbayar: malam ini kamu bisa menemukan siapa saja. Pilih korbanmu langsung.","The contract paid off: a second victim tonight.":"Kontraknya terbayar: malam ini ada korban kedua.","The evidence pointing at {name} was planted.":"Bukti yang mengarah ke {name} ternyata ditanam.","Autopsy: {name}'s body was scrubbed too well. Nothing to learn.":"Otopsi: mayat {name} dibersihkan terlalu rapi. Tidak ada yang bisa dipelajari.","A gold ring was found on the body. Its owner, the Godfather, hid in {room} that night.":"Cincin emas ditemukan di mayat. Pemiliknya, sang Godfather, sembunyi di {room} malam itu.","A gold ring was found on the body: the Godfather did this personally.":"Cincin emas ditemukan di mayat: Godfather turun tangan sendiri.","a glove embroidered with {name}'s initials":"sarung tangan bersulam inisial {name}","a heavy gold signet ring":"cincin stempel emas yang berat","a smear of blood the cleaner missed":"noda darah yang terlewat oleh si pembersih","Stakeout of {room}: {list}.":"Pengintaian {room}: {list}.","Stakeout of {room}: nobody hid there.":"Pengintaian {room}: tidak ada yang sembunyi di sana.","Stakeout of {name}: {list} came by tonight.":"Pengintaian rumah {name}: {list} datang malam ini.","Stakeout of {name}: nobody came by tonight.":"Pengintaian rumah {name}: tidak ada yang datang malam ini.","Put out a contract":"Pasang kontrak",Contract:"Kontrak","Emergency surgery":"Operasi darurat",Operating:"Mengoperasi","Stake out":"Mengintai","Repair the network?":"Perbaiki jaringan?",Repairing:"Memperbaiki","Clean up or frame someone":"Bersihkan atau jebak seseorang",Ready:"Siap","Use it tonight":"Pakai malam ini",CLEAN:"BERSIHKAN",PLANT:"TANAM BUKTI","Hide the victim’s role and wipe the scene.":"Sembunyikan peran korban dan hapus TKP.","Leave evidence pointing at an innocent.":"Tinggalkan bukti yang mengarah ke orang tak bersalah.","Repair the network":"Perbaiki jaringan","A miracle!":"Keajaiban!","{name} has been brought back to life.":"{name} hidup kembali.","Seal the contract":"Segel kontraknya","Hold the button and let go while the wax is in the gold band.":"Tahan tombolnya, lalu lepas saat lilin ada di pita emas.",Hold:"Tahan","Scrub the scene":"Gosok TKP","Drag your finger over every stain until the floor is clean.":"Usap semua noda sampai lantainya bersih.","{n} left":"sisa {n}",Defibrillator:"Defibrilator","Press SHOCK when the dot crosses the spike. Two good shocks in a row.":"Tekan KEJUT saat titik melewati lonjakan. Dua kali tepat berturut-turut.","{n} of 2":"{n} dari 2",Shock:"Kejut",Binoculars:"Teropong","Slide until the window comes into focus, then hold still for a second.":"Geser sampai jendelanya fokus, lalu tahan sedetik.",Focus:"Fokus","Patch the network":"Sambung jaringan","Tap a wire on the left, then the plug with the same colour on the right.":"Ketuk kabel di kiri, lalu colokan dengan warna sama di kanan.",wire:"kabel",plug:"colokan","You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent. Once per game you can put a contract on someone: if the town votes them out, the Mafia is rewarded.":"Kamu pemimpin Mafia. Pilihan targetmu mengalahkan yang lain. Detektif melihatmu Tidak Bersalah. Sekali per game kamu bisa memasang kontrak pada seseorang: kalau warga mem-vote dia keluar, Mafia dapat hadiah.","You are part of the Mafia. Every third night, either CLEAN the Mafia’s victim (role never announced, scene wiped) or PLANT evidence pointing at an innocent. One time in four you leave a stain. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Tiap tiga malam, BERSIHKAN korban Mafia (peran tidak diumumkan, TKP dihapus) atau TANAM BUKTI yang mengarah ke orang tak bersalah. Satu dari empat kali ada noda tertinggal. Kamu juga ikut memilih target Mafia.","Realistic mode only. Each night, watch one room through its camera: at dawn you see who hid there, who came in, what happened, and where the footprints lead. Every other night you can repair the network instead to fight glitches and hacks.":"Hanya di mode realistis. Setiap malam, pantau satu ruangan lewat kameranya: saat fajar kamu lihat siapa yang sembunyi, siapa yang masuk, apa yang terjadi, dan ke mana jejak kakinya. Selang semalam kamu bisa memperbaiki jaringan untuk melawan gangguan dan retasan.","Each night, choose one player to protect. If the Mafia attacks them, they survive. You may not protect the same player two nights in a row. Once per game you can try emergency surgery on someone who died the night before.":"Setiap malam, pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya, dia selamat. Kamu tidak boleh melindungi orang yang sama dua malam berturut-turut. Sekali per game kamu bisa mencoba operasi darurat pada orang yang mati semalam.","Each night, choose one player to investigate. You learn whether they are Suspicious (Mafia) or Innocent. Beware: the Godfather appears innocent. Instead, you can stake out a house or a room, but you might be spotted.":"Setiap malam, pilih satu pemain untuk diselidiki. Kamu akan tahu apakah dia Mencurigakan (Mafia) atau Tidak Bersalah. Awas: Godfather terlihat tidak bersalah. Sebagai gantinya, kamu bisa mengintai rumah atau ruangan, tapi bisa ketahuan.","Their ability does nothing tonight. If they try to use it, you catch them red-handed and learn their role.":"Kemampuannya tidak berfungsi malam ini. Kalau dia mencoba memakainya, kamu memergokinya dan tahu perannya.","Floodlight the whole town: no glitches, locks or hacks tonight and tomorrow. Two in five times the Mafia spots who you are.":"Sorot seluruh kota: tidak ada gangguan, kunci, atau retasan malam ini dan besok. Dua dari lima kali Mafia tahu siapa kamu.","Floodlight the whole town: no glitches, locks or hacks tonight and tomorrow. Aim the beam at a room: a raid there is blinded and fails. Two in five times the Mafia spots where you are.":"Sorot seluruh kota: tidak ada gangguan, kunci, atau retasan malam ini dan besok. Arahkan sinarnya ke satu ruangan: penggerebekan di sana silau dan gagal. Dua dari lima kali Mafia tahu di mana kamu.","Once per game: a flash vision of someone’s exact role tonight. One time in four it lies, and the crystal cracks for two nights.":"Sekali per game: penglihatan kilat peran persis seseorang malam ini. Satu dari empat kali penglihatannya bohong, dan kristalnya retak selama dua malam.","Or spend your flash on a room: learn how many of the Mafia hide there tonight.":"Atau pakai penglihatan kilat untuk satu ruangan: tahu berapa Mafia yang sembunyi di sana malam ini.","Your crystal ball is cracked. You see again on night {n}.":"Bola kristalmu retak. Kamu bisa melihat lagi di malam {n}.","Your crystal ball cracked. You will be blind for two nights.":"Bola kristalmu retak. Kamu buta selama dua malam.","Your floodlight is on. The town is safe from glitches tonight and tomorrow.":"Lampu sorotmu menyala. Kota aman dari gangguan malam ini dan besok.","Your floodlight is on, and the beam is aimed at {room}.":"Lampu sorotmu menyala, dan sinarnya diarahkan ke {room}.","The light gave them away: {name} is the Lightkeeper.":"Cahayanya membongkar dia: {name} adalah Penjaga Mercusuar.","The floodlight came from {room}: the Lightkeeper hid there.":"Lampu sorot itu datang dari {room}: Penjaga Mercusuar sembunyi di sana.","Your light drew attention. The Mafia may have spotted you.":"Cahayamu menarik perhatian. Mafia mungkin sudah tahu posisimu.","Caught red-handed: {name} tried to use a power. They are the {role}.":"Tertangkap basah: {name} mencoba memakai kekuatan. Dia adalah {role}.","Flash vision: {name} is the {role}.":"Penglihatan kilat: {name} adalah {role}.","Flash vision of {room}: one of the Mafia hid there.":"Penglihatan kilat {room}: satu Mafia sembunyi di sana.","Flash vision of {room}: {n} of the Mafia hid there.":"Penglihatan kilat {room}: {n} Mafia sembunyi di sana.","The lamp is cooling down. Floodlight ready again on night {n}.":"Lampunya sedang mendingin. Lampu sorot siap lagi di malam {n}.","Lock a room: nobody can raid it, but whoever hides inside cannot use their powers either. One time in four the lock is picked.":"Kunci satu ruangan: tidak ada yang bisa menggerebeknya, tapi yang sembunyi di dalam juga tidak bisa memakai kekuatan. Satu dari empat kali kuncinya dibobol.","You locked {room}. Nobody gets in tonight.":"Kamu mengunci {room}. Tidak ada yang bisa masuk malam ini.","{room} was locked tight. You could not get in.":"{room} terkunci rapat. Kalian tidak bisa masuk.","A blinding light filled {room}. You could not see anyone.":"Cahaya menyilaukan memenuhi {room}. Kalian tidak bisa melihat siapa pun.","You picked the lock on {room}. The Locksmith hid in {other}.":"Kalian membobol kunci {room}. Tukang Kunci sembunyi di {other}.","Someone picked your lock on {room}.":"Ada yang membobol kuncimu di {room}.","Your NERF hack was burned out by a blinding light.":"Retasan NERF-mu terbakar oleh cahaya yang menyilaukan.","The Lightkeeper needs a Locksmith, a Hacker or Realistic mode.":"Penjaga Mercusuar butuh Tukang Kunci, Peretas, atau mode realistis.","Each night, study one player. Night one reveals whether they act at night, the next reveals their team, the third reveals their exact role. Switching to someone else starts over. Once per game, a flash vision shows an exact role at once, but it can lie and it cracks your crystal for two nights.":"Setiap malam, amati satu pemain. Malam pertama mengungkap apakah dia beraksi di malam hari, berikutnya timnya, dan yang ketiga peran persisnya. Ganti orang berarti mulai dari awal. Sekali per game, penglihatan kilat langsung menunjukkan peran persis, tapi bisa bohong dan membuat kristalmu retak dua malam.","In games with a Locksmith, a Hacker or Realistic mode. Each night, shine your light on one player: they cannot be locked or hacked tonight. Every third night, floodlight the whole town against glitches, locks and hacks, but the Mafia may spot you.":"Ada di game dengan Tukang Kunci, Peretas, atau mode realistis. Setiap malam, sorot satu pemain: dia tidak bisa dikunci atau diretas malam ini. Tiap tiga malam, sorot seluruh kota dari gangguan, kunci, dan retasan, tapi Mafia bisa tahu posisimu.","Each night, lock one player. Whatever ability they have does nothing tonight, including a Mafia member’s vote on who dies. If they try to use it, you catch them red-handed and learn their role. In realistic mode you can also lock a whole room.":"Setiap malam, kunci satu pemain. Kemampuan apa pun yang dia punya tidak berfungsi malam ini, termasuk suara anggota Mafia soal siapa yang dibunuh. Kalau dia mencoba memakainya, kamu memergokinya dan tahu perannya. Di mode realistis kamu juga bisa mengunci seluruh ruangan.","Shield the town from locks, glitches and hacks.":"Lindungi kota dari kunci, gangguan, dan retasan.","Needs a Locksmith, a Hacker or Realistic mode.":"Butuh Tukang Kunci, Peretas, atau mode realistis.","Flash vision":"Penglihatan kilat",Seen:"Terlihat","Flash vision: a room":"Penglihatan kilat: ruangan","Floodlight the town":"Sorot kota",Lit:"Menyala","Lock a room":"Kunci ruangan",Locked:"Terkunci","Light up the town":"Nyalakan mercusuar","Read the stars":"Baca bintang","Watch the stars light up, then tap them in the same order.":"Perhatikan bintang yang menyala, lalu ketuk dengan urutan yang sama.",star:"bintang","watch…":"perhatikan…","{a}/{b}":"{a}/{b}","Aim the lighthouse":"Arahkan mercusuar","Turn the lens until the beam hits the marker, then light it.":"Putar lensa sampai sinarnya kena tanda, lalu nyalakan.",Lens:"Lensa",Light:"Nyalakan","Pick the lock":"Cungkil gembok","Tap SET when the moving pin crosses the shear line. Miss and the pins drop.":"Ketuk PAS saat pin yang bergerak melewati garis. Meleset, semua pin jatuh.","{n} of 4 pins":"{n} dari 4 pin",Set:"Pas","A threat was slipped under your door. You are too scared to vote today.":"Ada surat ancaman diselipkan di bawah pintumu. Kamu terlalu takut untuk vote hari ini.","No wounds. A frozen smile on their face.":"Tanpa luka. Wajahnya membeku dengan senyuman.","Once per game: act guilty tonight. If the Detective checks you, you look Suspicious.":"Sekali per game: pura-pura bersalah malam ini. Kalau Detektif memeriksamu, kamu terlihat Mencurigakan.","Once per game: slip a threat under someone’s door. Tomorrow their vote does not count, and they are too scared to talk at first.":"Sekali per game: selipkan surat ancaman di bawah pintu seseorang. Besok suaranya tidak dihitung, dan awalnya dia terlalu takut untuk bicara.","Once per game: start a rumor. Tomorrow morning the whole town hears that this player was seen sneaking out.":"Sekali per game: sebarkan gosip. Besok pagi seluruh kota dengar bahwa pemain ini terlihat mengendap-endap keluar.","Once per game: swap your target for one of these two.":"Sekali per game: ganti targetmu dengan salah satu dari dua orang ini.","Or interrogate someone instead of shooting: tomorrow everyone sees their heart rate under the lamp. Your badge is shown to all, and three times in ten a nervous innocent spikes too.":"Atau interogasi seseorang alih-alih menembak: besok semua orang melihat detak jantungnya di bawah lampu. Lencanamu terlihat semua orang, dan tiga dari sepuluh kali orang tak bersalah yang gugup juga berdebar.","Rumor: someone saw {name} sneaking out last night.":"Gosip: ada yang melihat {name} mengendap-endap keluar semalam.","Your new target is {name}.":"Target barumu adalah {name}.","{name} got your message. Their vote will not count today.":"{name} sudah menerima pesan kalian. Suaranya tidak dihitung hari ini.","{name} was found in {room} with a frozen smile. The Jester's curse came true.":"{name} ditemukan di {room} dengan senyum membeku. Kutukan Badut jadi kenyataan.","{name}'s laughter echoes through the town. {other} has been cursed.":"Tawa {name} menggema di seluruh kota. {other} terkena kutukan.","{name}, the Sheriff, interrogated {other} under the lamp. Their heart stayed calm.":"{name}, sang Sheriff, menginterogasi {other} di bawah lampu. Detak jantungnya tetap tenang.","{name}, the Sheriff, interrogated {other} under the lamp. Their heart was racing.":"{name}, sang Sheriff, menginterogasi {other} di bawah lampu. Jantungnya berdebar kencang.","You are too scared to speak yet.":"Kamu masih terlalu takut untuk bicara.","No wounds at all. The Jester’s curse took them.":"Sama sekali tanpa luka. Kutukan Badut merenggutnya.","Something cold reached for you in the night, but you were protected.":"Sesuatu yang dingin mencoba meraihmu di malam hari, tapi kamu terlindungi.",QUIET:"DIAM",suspect:"tersangka","{n} of 5":"{n} dari 5","Write the threat":"Tulis ancamannya","Tap the cut-out letters to spell the word, in order. A wrong letter and you start over.":"Ketuk potongan huruf untuk menyusun kata, berurutan. Salah satu huruf, ulang dari awal.","Under the lamp":"Di bawah lampu","Tap the suspect’s face five times. They will not keep still.":"Ketuk wajah tersangka lima kali. Dia tidak akan diam.","Interrogation room":"Ruang interogasi","{n} bpm":"{n} bpm","{sheriff}, the Sheriff, put {name} under the lamp.":"{sheriff}, sang Sheriff, menginterogasi {name} di bawah lampu.","Their heart was racing.":"Jantungnya berdebar kencang.","They stayed calm.":"Dia tetap tenang.","Nerves are not proof: innocent hearts race too, sometimes.":"Gugup bukan bukti: jantung orang tak bersalah juga kadang berdebar.","Act guilty":"Pura-pura bersalah","Send a threat":"Kirim ancaman","Act guilty tonight?":"Pura-pura bersalah malam ini?","Change your target":"Ganti targetmu","Start a rumor":"Sebar gosip",Interrogate:"Interogasi",Threatened:"Diancam",Acting:"Berakting",Switched:"Diganti",Whispered:"Dibisikkan",Interrogating:"Menginterogasi","You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you. Instead of shooting, you can interrogate someone: at dawn everyone sees whether their heart raced, but the town learns you are the Sheriff.":"Pelurumu terbatas. Di malam hari kamu boleh menembak satu pemain. Kalau menembak warga tak bersalah, rasa bersalah bisa menghabisimu. Daripada menembak, kamu bisa menginterogasi seseorang: pagi harinya semua orang melihat apakah jantungnya berdebar, tapi warga jadi tahu kamu Sheriff.","You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss. When you are voted out, one of your voters is cursed and dies the next night. Once per game you can act guilty so a Detective sees you as suspicious.":"Kamu menang kalau warga mem-vote kamu keluar. Bertingkahlah mencurigakan, tapi jangan berlebihan. Mati di malam hari berarti kalah. Saat kamu di-vote keluar, salah satu yang mem-vote kamu kena kutukan dan mati malam berikutnya. Sekali per game kamu bisa pura-pura bersalah agar Detektif melihatmu mencurigakan.","You are given one target from the town. You win if the town votes them out. If they die any other way, you become a Jester. Once per game you may swap your target for one of two others, and once per game you may start a rumor about anyone.":"Kamu diberi satu target dari warga. Kamu menang kalau warga mem-vote dia keluar. Kalau dia mati dengan cara lain, kamu jadi Badut. Sekali per game kamu boleh menukar targetmu dengan salah satu dari dua pilihan, dan sekali per game kamu boleh menyebar gosip tentang siapa pun.",Threaten:"Ancam",Act:"Beraksi",Switch:"Tukar",Whisper:"Bisikkan","day {n} // the lighthouse kept watch all night":"hari {n} // mercusuar berjaga sepanjang malam","The lighthouse kept watch":"Mercusuar berjaga","The whole town was floodlit last night: no glitches, locks or hacks, tonight included.":"Seluruh kota disinari semalam: tidak ada gangguan, kunci, atau retasan, termasuk malam ini."},Dc=(e,t,n)=>e.replace(/\{(\w+)\}/g,(a,i)=>{const s=t[i];return s==null?"":typeof s=="string"?n(s):String(s)});let Qs=null;function R5(){return Qs||(Qs=Object.keys(dl).filter(e=>/\{\w+\}/.test(e)).map(e=>{const t=e.split(/\{(\w+)\}/),n=[];let a="";return t.forEach((i,s)=>{s%2===1?(n.push(i),a+="(.+?)"):a+=i.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}),{re:new RegExp(`^${a}$`,"s"),keys:n,tpl:e}}).sort((e,t)=>t.tpl.replace(/\{\w+\}/g,"").length-e.tpl.replace(/\{\w+\}/g,"").length),Qs)}const Zs=new Map;function wg(e){return dl[e]}function h(e,t){if(e==null) u TANAM BUKTI ke orang tak bersalah. Kadang ada noda tertinggal."],day:Vc,win:Sa},framer:{night:["Frame one player. If the Detective checks them tonight, they look Suspicious.","Jebak satu pemain. Kalau Detektif memeriksanya malam ini, dia terlihat Mencurigakan."],day:["Frame people who are getting close to the truth.","Jebak orang yang mulai mendekati kebenaran."],win:Sa},coroner:{night:["Examine one body: you learn the true role and which side killed them, even a cleaned body.","Periksa satu mayat: kamu tahu peran aslinya dan pihak mana yang membunuhnya, termasuk mayat yang sudah dibersihkan."],day:["Use autopsies to expose lies about who was who.","Pakai hasil otopsi untuk membongkar kebohongan soal peran orang."],win:Pe},tracker:{night:["Follow one player. At dawn you learn who they visited, or that they stayed home.","Ikuti satu pemain. Saat fajar kamu tahu siapa yang dia datangi, atau dia diam di rumah."],day:["Someone who visited last night’s victim is a prime suspect.","Orang yang mendatangi korban semalam adalah tersangka utama."],win:Pe},spy:{night:["Listen to the Mafia’s chat. Names are hidden and some words are lost.","Dengarkan chat Mafia. Nama disamarkan dan sebagian kata hilang."],day:["Drop hints from what you overheard without exposing yourself.","Beri petunjuk dari yang kamu dengar tanpa membongkar dirimu."],win:Pe},executioner:{night:["Once per game, swap your target for one of two others. Once per game, start a rumor: at dawn the town hears someone saw them sneaking out.","Sekali per game, tukar targetmu dengan salah satu dari dua pilihan. Sekali per game, sebar gosip: pagi harinya warga dengar ada yang melihat dia menyelinap keluar."],day:["You know your target. Convince the town they are guilty.","Kamu tahu targetmu. Yakinkan warga bahwa dia bersalah."],win:["You win if your target is voted out. If they die another way, you become a Jester.","Kamu menang kalau targetmu di-vote keluar. Kalau dia mati dengan cara lain, kamu jadi Badut."]},veteran:{night:["Twice per game, go on alert: everyone who visits you dies, and you cannot be killed.","Dua kali per game, siaga: siapa pun yang mendatangimu mati, dan kamu tidak bisa dibunuh."],day:["Hint that you are dangerous, or keep quiet and set a trap.","Beri kode bahwa kamu berbahaya, atau diam dan pasang jebakan."],win:Pe},journalist:{night:["Once per game, investigate one player. Their role is printed in the morning paper.","Sekali per game, selidiki satu pemain. Perannya dimuat di koran pagi."],day:["Pick your story well: you only get one.","Pilih beritamu baik-baik: kesempatanmu cuma sekali."],win:Pe},twin:{night:s3,day:["You and your twin know you are both Town. Back each other up.","Kamu dan kembaranmu tahu kalian sama-sama Warga. Saling dukung."],win:Pe},security:{night:["Watch one room on CCTV, or every other night repair the network to halve glitches and maybe block a NERF hack.","Pantau satu ruangan lewat CCTV, atau selang semalam perbaiki jaringan untuk mengurangi gangguan dan mungkin memblokir retasan NERF."],day:["Footage is strong evidence. Share it at the right time.","Rekaman adalah bukti kuat. Bagikan di saat yang tepat."],win:Pe},citizen:{night:["You sleep. You may get a small task so nobody can tell you have no power. Just tap along.","Kamu tidur. Kadang ada tugas kecil supaya orang lain tidak tahu kamu tanpa kekuatan. Ikuti saja."],day:["Your voice and your vote are your weapons. Watch who changes their story.","Suara dan vote-mu adalah senjatamu. Perhatikan siapa yang ceritanya berubah-ubah."],win:Pe},detective:{night:["Investigate one player, or stake out a house (normal) or a room (realistic) to see who comes and goes. Stakeouts can get you spotted.","Selidiki satu pemain, atau intai rumah (mode normal) atau ruangan (mode realistis) untuk melihat siapa yang datang. Mengintai bisa bikin kamu ketahuan."],day:["Share what you found carefully: if the Mafia learns you are the Detective, you are next.","Bagikan temuanmu dengan hati-hati: kalau Mafia tahu kamu Detektif, kamu target berikutnya."],win:Pe},doctor:{night:["Protect one player. Once per game, try emergency surgery on someone who died last night: half the time they live, but a failure exposes you.","Lindungi satu pemain. Sekali per game, coba operasi darurat pada orang yang mati semalam: setengah kemungkinan dia hidup, tapi kalau gagal kamu ketahuan."],day:["Guess who the Mafia wants dead next. Protect the players who are helping the town most.","Tebak siapa yang ingin dibunuh Mafia berikutnya. Lindungi pemain yang paling membantu warga."],win:Pe},bodyguard:{night:["Once per game, pick a player to guard for good. The first attack on them is blocked.","Sekali per game, pilih satu pemain untuk dijaga selamanya. Serangan pertama ke dia akan ditahan."],day:["Choose someone you trust and who matters: a confirmed Detective is a great pick.","Pilih orang yang kamu percaya dan penting: Detektif yang sudah terbukti adalah pilihan bagus."],win:Pe},sheriff:{night:["You may shoot one player. Bullets are limited, and shooting an innocent can cost you your life. Or interrogate instead: the whole town sees their heart rate at dawn, and learns you are the Sheriff.","Kamu boleh menembak satu pemain. Pelurumu terbatas, dan menembak orang tak bersalah bisa membuatmu mati. Atau interogasi: seluruh warga melihat detak jantungnya saat pagi, dan jadi tahu kamu Sheriff."],day:["Only fire when you are sure. Use the day to build the case first.","Tembak hanya kalau yakin. Kumpulkan bukti dulu di siang hari."],win:Pe},mafia:{night:["Wake with your partners, chat in the Mafia den and agree on one victim. Once per game, slip a threat under someone’s door: they cannot vote tomorrow and are too scared to talk at first.","Bangun bersama rekanmu, ngobrol di markas Mafia dan sepakati satu korban. Sekali per game, selipkan surat ancaman: besok dia tidak bisa vote dan awalnya terlalu takut bicara."],day:Vc,win:Sa},godfather:{night:["Your pick of victim beats the others. Once per game, seal a contract on someone: if the town votes them out, you get a reward the next night.","Pilihan korbanmu mengalahkan yang lain. Sekali per game, segel kontrak pada seseorang: kalau warga mem-vote dia keluar, kamu dapat hadiah malam berikutnya."],day:["The Detective sees you as Innocent, so you can afford to talk boldly.","Detektif melihatmu Tidak Bersalah, jadi kamu bisa bicara lebih berani."],win:Sa},silencer:{night:["From night 2, tape one player’s mouth: they cannot talk tomorrow. Then wait three nights to do it again.","Mulai malam 2, lakban mulut satu pemain: dia tidak bisa bicara besok. Lalu tunggu tiga malam untuk melakukannya lagi."],day:["Silence the loudest accuser at the right moment. You also vote on the Mafia victim.","Bungkam penuduh paling vokal di saat yang tepat. Kamu juga ikut memilih korban Mafia."],win:Sa},jester:{night:["Once per game, act guilty: a Detective checking you tonight sees you as suspicious.","Sekali per game, pura-pura bersalah: Detektif yang memeriksamu malam ini melihatmu mencurigakan."],day:["Look suspicious, but not too obviously. You want the town to vote you out.","Bertingkahlah mencurigakan, tapi jangan berlebihan. Kamu ingin warga mem-vote kamu keluar."],win:["You win if the town votes you out. One of your voters is cursed and dies the next night. Being killed at night is a loss.","Kamu menang kalau di-vote keluar oleh warga. Salah satu yang mem-vote kamu kena kutukan dan mati malam berikutnya. Mati di malam hari berarti kalah."]},survivor:{night:["You can put on a bulletproof vest to survive one attack. Vests are limited.","Kamu bisa memakai rompi antipeluru untuk selamat dari satu serangan. Rompi terbatas."],day:["Stay out of trouble and side with whoever looks like winning.","Hindari masalah dan berpihaklah pada yang terlihat akan menang."],win:["You win if you are still alive at the end, whoever wins.","Kamu menang kalau masih hidup di akhir, siapa pun pemenangnya."]},cupid:{night:["On night 1, choose two players to fall in love (you may pick yourself). If one dies, the other dies too.","Di malam 1, pilih dua pemain untuk jatuh cinta (boleh dirimu). Kalau satu mati, yang lain ikut mati."],day:["Keep the lovers alive, or use them to set a trap.","Jaga pasangan itu tetap hidup, atau jadikan mereka jebakan."],win:Pe},baker:{night:["Give fresh bread to one player. Their vote counts double tomorrow.","Beri roti hangat ke satu pemain. Suaranya dihitung dua kali besok."],day:["Feed the people you trust so the town’s best voices weigh more.","Beri roti ke orang yang kamu percaya supaya suara terbaik warga lebih berbobot."],win:Pe},bomb:{night:["You have no night action, but you are wired to blow.","Kamu tidak punya aksi malam, tapi tubuhmu dipasangi bom."],day:["If the Mafia kills you, one of them dies too. If the town votes you out, one of your voters dies.","Kalau Mafia membunuhmu, salah satu dari mereka ikut mati. Kalau kamu di-vote keluar, salah satu pemilihmu ikut mati."],win:Pe},mayor:{night:["You have no night power.","Kamu tidak punya kekuatan malam."],day:["On odd days (1, 3, 5…) your vote counts twice. Use it to break close votes.","Di hari ganjil (1, 3, 5…) suaramu dihitung dua kali. Pakai untuk memecah vote yang ketat."],win:Pe},locksmith:{night:["Lock one player: their power does nothing, and if they try it you learn their role. In realistic mode, pick a lock to seal a whole room against raids.","Kunci satu pemain: kekuatannya tidak berfungsi, dan kalau dia mencoba memakainya kamu tahu perannya. Di mode realistis, cungkil gembok untuk mengunci seluruh ruangan dari penggerebekan."],day:["Lock the people you suspect are Mafia to stop their kill.","Kunci orang yang kamu curigai Mafia untuk menggagalkan pembunuhan mereka."],win:Pe},lightkeeper:{night:["Shine on one player each night. Every third night, aim the lighthouse to floodlight the town: no glitches, locks or hacks tonight and tomorrow. In realistic mode the beam also blinds a raid on one room.","Sorot satu pemain tiap malam. Tiap tiga malam, arahkan mercusuar untuk menyinari kota: tidak ada gangguan, kunci, atau retasan malam ini dan besok. Di mode realistis sinarnya juga membuat penggerebekan di satu ruangan gagal."],day:["If someone tried to tamper with your target, tell the town: it is a strong clue.","Kalau ada yang mencoba mengganggu targetmu, ceritakan ke warga: itu petunjuk kuat."],win:Pe},oracle:{night:["Study one player night after night. Once per game, read the stars for a flash vision of an exact role (or how many Mafia hide in a room). It can lie, and you go blind for two nights.","Amati satu pemain malam demi malam. Sekali per game, baca bintang untuk penglihatan kilat peran persis (atau jumlah Mafia di satu ruangan). Bisa bohong, dan kamu buta dua malam."],day:["Stay on the same person to get the full picture. Switching starts over.","Tetap amati orang yang sama untuk gambaran lengkap. Ganti orang berarti mulai dari awal."],win:Pe},medium:{night:["You can chat with the dead in the graveyard chat. Ask what they saw.","Kamu bisa ngobrol dengan arwah di chat kuburan. Tanyakan apa yang mereka lihat."],day:["Bring the ghosts’ clues to the living, without revealing yourself too early.","Bawa petunjuk dari arwah ke yang masih hidup, tanpa membuka identitasmu terlalu cepat."],win:Pe},witness:{night:["You have no night power, but if the Mafia kills you, you see who did it.","Kamu tidak punya kekuatan malam, tapi kalau Mafia membunuhmu, kamu melihat pelakunya."],day:["If you die, name your killer in your last words.","Kalau kamu mati, sebut nama pembunuhmu di pesan terakhir."],win:Pe},retributionist:{night:["Once per game, take a dead player’s power. You keep it until you die.","Sekali per game, ambil kekuatan pemain yang sudah mati. Kekuatan itu milikmu sampai kamu mati."],day:["Wait for a strong role to fall (Detective, Doctor…) and carry on their work.","Tunggu peran kuat gugur (Detektif, Dokter…) lalu lanjutkan tugasnya."],win:Pe},hacker:{night:["On nights 1, 3, 5… crack t
