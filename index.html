ategory:"special"},sheriff:{id:"sheriff",name:"Sheriff",short:"Limited shots to eliminate suspects at night.",team:"town",description:"You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you.",nightAction:!0,icon:"SHF",color:"#ec9f68",category:"special"},mafia:{id:"mafia",name:"Mafia",team:"mafia",short:"Eliminate one player every night.",description:"Each night, the Mafia agrees on one player to eliminate. Blend in during the day and avoid suspicion.",nightAction:!0,icon:"MAF",color:"#ff2b3d"},godfather:{id:"godfather",name:"Godfather",team:"mafia",short:"Leads the Mafia. Appears innocent to the Detective.",description:"You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent.",nightAction:!0,icon:"GDF",color:"#ff6a55"},silencer:{id:"silencer",name:"Silencer",team:"mafia",short:"Silence a player. Not on night 1; once every 3 nights.",description:"You are part of the Mafia. From the second night, you can silence one player for the next day, then you must wait three nights before silencing again. You also help choose the Mafia target.",nightAction:!0,icon:"SIL",color:"#e0457a",category:"special"},jester:{id:"jester",name:"Jester",team:"neutral",short:"Win by getting voted out.",description:"You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss.",nightAction:!1,icon:"JST",color:"#c49cff",category:"special"},cupid:{id:"cupid",name:"Cupid",team:"town",short:"Bind two players as lovers on the first night.",description:"On the first night, choose two players to fall in love (you may choose yourself). The lovers learn who each other is. If one lover dies, by night or by vote, the other dies of a broken heart.",nightAction:!0,icon:"CPD",color:"#ff8fb8",category:"special"},bomb:{id:"bomb",name:"Bomb",team:"town",short:"Explode and take your killer with you.",description:"You have no night action, but you are wired to blow. If the Mafia kills you, the blast takes one of them with you. If the town votes you out, the blast takes one of the players who voted for you.",nightAction:!1,icon:"BMB",color:"#ffb347",category:"special"},baker:{id:"baker",name:"Baker",team:"town",short:"Give bread each night. Bread doubles a vote.",description:"Each night, deliver fresh bread to another player. The whole town sees who got bread, and that player's vote counts double the next day. Feed the people you trust.",nightAction:!0,icon:"BKR",color:"#e9c28a",category:"special"},mayor:{id:"mayor",name:"Mayor",team:"town",short:"Your vote counts twice, every other day.",description:"You lead the town. On odd-numbered days (day 1, 3, 5…) your vote counts twice. On even days it recharges and counts once.",nightAction:!1,icon:"MYR",color:"#f2d06b",category:"special"},hacker:{id:"hacker",name:"Hacker",team:"mafia",short:"Scramble the information around one player.",description:"You are part of the Mafia. Each night, hack one player. Any investigation they make, and any investigation made on them, returns corrupted results tonight. You also help choose the Mafia target.",nightAction:!0,icon:"HCK",color:"#4dff9a",category:"special"},locksmith:{id:"locksmith",name:"Locksmith",team:"town",short:"Lock one player’s ability for the night.",description:"Each night, lock one player. Whatever ability they have does nothing tonight, including a Mafia member’s vote on who dies. Locking someone with no ability has no effect.",nightAction:!0,icon:"LCK",color:"#c9a36b",category:"special"},oracle:{id:"oracle",name:"Oracle",team:"town",short:"Learn one player’s identity, a little more each night.",description:"Each night, study one player. Night one reveals whether they act at night, the next reveals their team, the third reveals their exact role. Switching to someone else starts over.",nightAction:!0,icon:"ORC",color:"#b18cff",category:"special"},gambler:{id:"gambler",name:"Gambler",team:"neutral",short:"Guess roles. Win big or pay the price.",description:"Each night, guess one player’s role. Guess right and you earn a lucky charm that survives one attack. Guess wrong and you lose your vote the next day. You win if you are alive at the end with at least two correct guesses.",nightAction:!0,icon:"GMB",color:"#ffcf4d",category:"special"},lightkeeper:{id:"lightkeeper",name:"Lightkeeper",team:"town",short:"Shield one player from locks and hacks.",description:"Only in games with a Locksmith. Each night, shine your light on one player: they cannot be locked or hacked tonight, and you learn whether anyone tried.",nightAction:!0,icon:"LGT",color:"#ffe9a8",category:"special"},shapeshifter:{id:"shapeshifter",name:"Shapeshifter",team:"mafia",short:"Disguise yourself as another player at night.",description:"You are part of the Mafia. Each night, take another player’s shape: anyone investigating you tonight sees that player’s identity instead of yours. You also help choose the Mafia target.",nightAction:!0,icon:"SHP",color:"#ff7ad9",category:"special"},medium:{id:"medium",name:"Medium",team:"town",short:"Talk with the dead at night.",description:"At night you can hear and speak with the spirits of the dead. Ask them what they saw before they died.",nightAction:!1,icon:"MED",color:"#9ee6ff",category:"special"},witness:{id:"witness",name:"Witness",team:"town",short:"If you are murdered, you see your killer.",description:"If the Mafia kills you at night, you see who did it in your last moment. Use your last words well.",nightAction:!1,icon:"WIT",color:"#e0e0e0",category:"special"},retributionist:{id:"retributionist",name:"Retributionist",team:"town",short:"Take a dead player’s power, once, for good.",description:"Once per game, choose a dead player whose power you want. From the next night you use that ability as your own until you die.",nightAction:!0,icon:"RET",color:"#8fb0ff",category:"special"},serialkiller:{id:"serialkiller",name:"Serial Killer",team:"neutral",short:"Kill one player ever Godfather terlihat tidak bersalah.","Each night, choose one player to protect. If the Mafia attacks them, they survive. You may not protect the same player two nights in a row.":"Setiap malam, pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya, dia selamat. Kamu tidak boleh melindungi orang yang sama dua malam berturut-turut.","Once per game, choose one player to guard. Your choice is permanent. The first attack on that player is blocked.":"Sekali dalam permainan, pilih satu pemain untuk dijaga. Pilihanmu permanen. Serangan pertama ke pemain itu akan ditahan.","You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you.":"Pelurumu terbatas. Di malam hari kamu boleh menembak satu pemain. Kalau yang kamu tembak ternyata warga tak bersalah, rasa bersalah bisa membunuhmu.","Each night, the Mafia agrees on one player to eliminate. Blend in during the day and avoid suspicion.":"Setiap malam, Mafia sepakat menghabisi satu pemain. Berbaurlah di siang hari dan hindari kecurigaan.","You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent.":"Kamu pemimpin Mafia. Pilihan targetmu mengalahkan yang lain. Detektif melihatmu Tidak Bersalah.","You are part of the Mafia. Each night, choose one player: they cannot speak during the next day. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, pilih satu pemain: dia tidak bisa bicara besok. Kamu juga ikut memilih target Mafia.","You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss.":"Kamu menang kalau warga mem-vote kamu keluar. Bertingkahlah mencurigakan, tapi jangan berlebihan. Mati di malam hari berarti kalah.","You win if you are alive when the game ends, whoever else wins. You have a limited number of bulletproof vests to use at night.":"Kamu menang kalau masih hidup saat permainan berakhir, siapa pun pemenangnya. Kamu punya rompi antipeluru terbatas untuk dipakai di malam hari.","On the first night, choose two players to fall in love (you may choose yourself). The lovers learn who each other is. If one lover dies, by night or by vote, the other dies of a broken heart.":"Di malam pertama, pilih dua pemain untuk saling jatuh cinta (boleh dirimu sendiri). Pasangan itu tahu siapa kekasihnya. Kalau salah satu mati, di malam hari atau karena vote, yang lain ikut mati patah hati.","You have no night action, but you are wired to blow. If the Mafia kills you, the blast takes one of them with you. If the town votes you out, the blast takes one of the players who voted for you.":"Kamu tidak punya aksi malam, tapi tubuhmu dipasangi bom. Kalau Mafia membunuhmu, ledakannya ikut menewaskan salah satu dari mereka. Kalau warga mem-vote kamu keluar, ledakannya menewaskan salah satu pemain yang memilihmu.","Each night, deliver fresh bread to another player. The whole town sees who got bread, and that player's vote counts double the next day. Feed the people you trust.":"Setiap malam, antarkan roti hangat ke pemain lain. Semua orang tahu siapa yang dapat roti, dan suara pemain itu dihitung dua kali besok. Beri makan orang yang kamu percaya.","Blood Moon":"Bulan Darah","Peaceful Night":"Malam Damai","Thick Fog":"Kabut Tebal","Town Elder":"Tetua Kota","Secret Ballot":"Pemungutan Rahasia","Short Fuse":"Sumbu Pendek","The Mafia is emboldened: every Mafia member may choose a separate target tonight.":"Mafia makin berani: setiap anggota Mafia boleh memilih target sendiri malam ini.","A strange calm falls over the town. No one can be killed tonight.":"Ketenangan aneh menyelimuti kota. Tidak ada yang bisa dibunuh malam ini.","Visibility is poor. The Detective receives no result tonight.":"Jarak pandang buruk. Detektif tidak mendapat hasil malam ini.","A randomly chosen player is named Town Elder: their vote counts twice today.":"Satu pemain acak dijadikan Tetua Kota: suaranya dihitung dua kali hari ini.","Votes are cast in secret today. Only totals are revealed.":"Hari ini voting dilakukan diam-diam. Hanya totalnya yang ditampilkan.","Tempers are high. Discussion time is halved today.":"Emosi memuncak. Waktu diskusi dipotong setengah hari ini.","{event}: {desc}":"{event}: {desc}",Map:"Peta",Random:"Acak",Village:"Desa",House:"Rumah",Hospital:"Rumah Sakit",Villa:"Vila","A different place every game.":"Tempat berbeda di setiap permainan.","A sleepy farming village with one road in and none out.":"Desa pertanian yang sepi. Ada satu jalan masuk, tak ada jalan keluar.","One big family house. Every door locks from the inside.":"Satu rumah keluarga besar. Semua pintu terkunci dari dalam.","A night shift at St. Agatha. The nurses see everything.":"Shift malam di RS St. Agatha. Para perawat melihat semuanya.","A private villa on a cliff. Champagne, secrets, no signal.":"Vila pribadi di tepi tebing. Sampanye, rahasia, tanpa sinyal.","The map decides where bodies are found and how each victim was killed.":"Peta menentukan di mana mayat ditemukan dan bagaimana korban dibunuh.","Crime scene · {map}":"TKP · {map}","Case file":"Berkas kasus","T.O.D.":"W.K.",Found:"Lokasi",Cause:"Penyebab",Clue:"Petunjuk","in {room}":"di {room}","the street":"jalanan","the town square":"alun-alun","the church bell tower":"menara lonceng gereja","the old well":"sumur tua","the barn":"lumbung","the windmill":"kincir angin","the cemetery":"pemakaman","the tavern cellar":"gudang bawah kedai","the riverbank":"tepi sungai","the kitchen":"dapur","the living room":"ruang tamu","the basement":"ruang bawah tanah","the attic":"loteng","the bathroom":"kamar mandi","the garden shed":"gudang kebun","the garage":"garasi","the staircase":"tangga","the emergency room":"IGD","the morgue":"kamar jenazah","the pharmacy":"apotek","the operating theatre":"ruang operasi","the nurse station":"pos perawat","the elevator":"lift","the rooftop":"atap gedung","the X-ray room":"ruang rontgen","the swimming pool":"kolam renang","the wine cella k jari terdaftar","Resident no.":"NIK",Name:"Nama",Status:"Status",Issued:"Diterbitkan",Guest:"Tamu","Valid until":"Berlaku hingga",Signature:"Tanda tangan",Death:"Mati",Curfew:"Jam malam",Photo:"Foto","Pixelate my photo":"Jadikan fotoku piksel","Turns your photo into a pixel portrait":"Mengubah fotomu jadi potret piksel","Remove photo":"Hapus foto","Choose a portrait":"Pilih potret","Flip card: account":"Balik kartu: akun","Flip card: front":"Balik kartu: depan","Registered as":"Terdaftar sebagai","Sign in with this card on any device to keep your name, photo and history.":"Masuk dengan kartu ini di perangkat mana pun untuk menyimpan nama, foto, dan riwayatmu.","Sign in with your card":"Masuk dengan kartumu","Register this card":"Daftarkan kartu ini","You are asleep":"Kamu tertidur","The night goes on without you. Something moves in the dark.":"Malam terus berjalan tanpamu. Ada yang bergerak dalam gelap.","Dawn in":"Fajar dalam","Wake up":"Bangun","Killed in {room}. {method}":"Dibunuh di {room}. {method}","You did not survive the night.":"Kamu tidak selamat malam ini.","The town has executed you.":"Warga telah mengeksekusimu.","Clues found: {a}, {b}. One of them points to the Mafia.":"Petunjuk ditemukan: {a}, {b}. Salah satunya mengarah ke Mafia.","Clues found: {a}. One of them points to the Mafia.":"Petunjuk ditemukan: {a}. Petunjuk ini mengarah ke Mafia.","Host a private room on this device. Friends join with the code.":"Jadi host ruangan privat di perangkat ini. Teman bergabung pakai kode.","PEER LINK READY":"JALUR PEER SIAP","Rooms run on the host’s device. The host keeps the game open and the screen on; everyone needs internet to connect. Works best on the same Wi-Fi.":"Ruangan berjalan di perangkat host. Host harus membiarkan game tetap terbuka dan layar menyala; semua perangkat butuh internet untuk tersambung. Paling lancar di WiFi yang sama.","Connecting to the host…":"Menyambung ke host…","You are the host. Leaving closes the room for everyone.":"Kamu host-nya. Kalau keluar, ruangan ditutup untuk semua orang.","This device is the host: the game runs here. Keep this page open and the screen on until the game ends. Share the code so friends can join.":"Perangkat ini adalah host: game berjalan di sini. Biarkan halaman ini terbuka dan layar tetap menyala sampai game selesai. Bagikan kodenya supaya teman bisa bergabung.","Connected to the host’s device. If the connection drops, the game reconnects automatically.":"Tersambung ke perangkat host. Kalau koneksi putus, game menyambung lagi otomatis.","Restoring your room…":"Memulihkan ruanganmu…","Could not reach the connection service. Check your internet and try again.":"Tidak bisa menghubungi layanan koneksi. Cek internetmu lalu coba lagi.","Could not create the room. Try again.":"Ruangan gagal dibuat. Coba lagi.","Room not found. Check the code and make sure the host still has the game open.":"Ruangan tidak ditemukan. Cek kodenya dan pastikan host masih membuka game-nya.","Lost the connection to the host.":"Koneksi ke host terputus.","The host closed the room.":"Host menutup ruangan.","This needs the online server version of Nightfall.":"Fitur ini butuh versi server online Nightfall.","Say hello first.":"Sambungan belum siap.","Creating room…":"Membuat ruangan…","Could not reach the connection service. Open the game from its website link in Safari or Chrome (not a file preview), check your internet, and try again.":"Tidak bisa menghubungi layanan koneksi. Buka game dari link website-nya di Safari atau Chrome (bukan preview file), cek internetmu, lalu coba lagi.","Playing across phones needs the website link (https://…) opened in Safari or Chrome. File previews and chat-app viewers block the connection. Pass & play still works here.":"Main antar-HP butuh link website (https://…) yang dibuka di Safari atau Chrome. Preview file dan penampil di aplikasi chat memblokir koneksinya. Main oper-HP tetap bisa di sini.","Silence a player. Not on night 1; once every 3 nights.":"Bungkam satu pemain. Tidak di malam 1; sekali tiap 3 malam.","You are part of the Mafia. From the second night, you can silence one player for the next day, then you must wait three nights before silencing again. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Mulai malam kedua, kamu bisa membungkam satu pemain untuk hari berikutnya, lalu harus menunggu tiga malam sebelum bisa membungkam lagi. Kamu juga ikut memilih target Mafia.",Mayor:"Wali Kota","Your vote counts twice, every other day.":"Suaramu dihitung dua kali, selang sehari.","You lead the town. On odd-numbered days (day 1, 3, 5…) your vote counts twice. On even days it recharges and counts once.":"Kamu pemimpin kota. Di hari ganjil (hari 1, 3, 5…) suaramu dihitung dua kali. Di hari genap suaramu mengisi ulang dan dihitung sekali.",Hacker:"Peretas","Scramble the information around one player.":"Kacaukan informasi di sekitar satu pemain.","You are part of the Mafia. Each night, hack one player. Any investigation they make, and any investigation made on them, returns corrupted results tonight. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, retas satu pemain. Semua penyelidikan yang dia lakukan, dan semua penyelidikan terhadap dirinya, memberi hasil rusak malam ini. Kamu juga ikut memilih target Mafia.",Locksmith:"Tukang Kunci","Lock one player’s ability for the night.":"Kunci kemampuan satu pemain untuk malam ini.","Each night, lock one player. Whatever ability they have does nothing tonight, including a Mafia member’s vote on who dies. Locking someone with no ability has no effect.":"Setiap malam, kunci satu pemain. Kemampuan apa pun yang dia punya tidak berfungsi malam ini, termasuk suara anggota Mafia soal siapa yang dibunuh. Mengunci orang tanpa kemampuan tidak berefek apa-apa.",Oracle:"Peramal","Learn one player’s identity, a little more each night.":"Ketahui identitas satu pemain, sedikit demi sedikit tiap malam.","Each night, study one player. Night one reveals whether they act at night, the next reveals their team, the third reveals their exact role. Switching to someone else starts over.":"Setiap malam, amati satu pemain. Malam pertama mengungkap apakah dia beraksi di malam hari, berikutnya timnya, dan yang ketiga peran persisnya. Ganti orang berarti mulai dari awal.",Gambler:"Penjudi","Guess roles. Win big or pay the price.":"Tebak peran. Menang besar atau tanggung akibatnya.","Each night, guess one player’s role. Guess right and you earn a lucky charm that survives one attack. Guess wrong and you lose your vote the next day. You win if you are alive at the end with at least two correct guesses.":"Setiap malam, tebak peran satu pemain. Tebakan benar memberimu jimat keberuntungan yang menahan satu serangan. Tebakan salah membuatmu kehilangan hak suara besok. Kamu menang kalau masih hidup di akhir dengan minimal dua tebakan benar.",Lightkeeper:"Penjaga Mercusuar","Shield one player from locks and hacks.":"Lindungi satu pemain dari kunci dan retasan.","Only in games with a Locksmith. Each night, shine your light on one player: they cannot be locked or hacked tonight, and you learn whether anyone tried.":"Hanya ada kalau ada Tukang Kunci. Setiap malam, sorot satu pemain dengan cahayamu: dia tidak bisa dikunci atau diretas malam ini, dan kamu tahu apakah ada yang mencoba.",Shapeshifter:"Pengubah Wujud","Disguise yourself as another player at night.":"Menyamar jadi pemain lain di malam hari.","You are part of the Mafia. Each night, take another player’s shape: anyone investigating you tonight sees that player’s identity instead of yours. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, ambil wujud pemain lain: siapa pun yang menyelidikimu malam ini melihat identitas orang itu, bukan identitasmu. Kamu juga ikut memilih target Mafia.",Medium:"Medium","Talk with the dead at night.":"Bicara dengan arwah di malam hari.","At night you can hear and speak with the spirits of the dead. Ask them what they saw before they died.":"Di malam hari kamu bisa mendengar dan berbicara dengan arwah orang mati. Tanyakan apa yang mereka lihat sebelum mati.",Witness:"Saksi","If you are murdered, you see your killer.":"Kalau kamu dibunuh, kamu melihat pembunuhmu.","If the Mafia kills you at night, you see who did it in your last moment. Use your last words well.":"Kalau Mafia membunuhmu di malam hari, di detik terakhir kamu melihat siapa pelakunya. Manfaatkan pesan terakhirmu baik-baik.",Retributionist:"Pembalas","Take a dead player’s power, once, for good.":"Ambil kekuatan pemain yang sudah mati, sekali, selamanya.","Once per game, choose a dead player whose power you want. From the next night you use that ability as your own until you die.":"Sekali dalam permainan, pilih pemain mati yang kekuatannya kamu mau. Mulai malam berikutnya kamu memakai kemampuan itu sebagai milikmu sampai kamu mati.","Choose where the victim dies and with what. The deciding vote picks the scene.":"Pilih di mana korban mati dan dengan apa. Suara penentu yang memilih TKP-nya.","Investigations by or about this player return corrupted results tonight.":"Penyelidikan oleh atau terhadap pemain ini memberi hasil rusak malam ini.","Their ability does nothing tonight. Locking someone with no ability has no effect.":"Kemampuannya tidak berfungsi malam ini. Mengunci orang tanpa kemampuan tidak berefek.","No dead player has a power you can take yet.":"Belum ada pemain mati yang kekuatannya bisa kamu ambil.","The dead can hear you tonight. Speak with them in the graveyard chat.":"Para arwah bisa mendengarmu malam ini. Bicaralah dengan mereka di chat kuburan.","They cannot be locked or hacked tonight. You will learn if anyone tried.":"Dia tidak bisa dikunci atau diretas malam ini. Kamu akan tahu kalau ada yang mencoba.","If you are murdered tonight, you will see who did it.":"Kalau kamu dibunuh malam ini, kamu akan melihat pelakunya.","Anyone investigating you tonight sees this player instead.":"Siapa pun yang menyelidikimu malam ini akan melihat pemain ini.","Choose a player to study. Each night on the same player reveals more.":"Pilih pemain untuk diamati. Tiap malam pada orang yang sama mengungkap lebih banyak.","Studying {name}: vision {a} of 3. Choose them again to see more, or start over with someone new.":"Mengamati {name}: penglihatan {a} dari 3. Pilih dia lagi untuk melihat lebih jauh, atau mulai ulang dengan orang lain.","You locked {name} in for the night.":"Kamu mengunci {name} semalaman.","Your light watched over {name}. Nobody tried to tamper with them.":"Cahayamu menjaga {name}. Tidak ada yang mencoba mengganggunya.","Someone tried to tamper with {name}, but your light kept them safe.":"Ada yang mencoba mengganggu {name}, tapi cahayamu melindunginya.","Your door was locked tonight. Your ability did nothing.":"Pintumu dikunci malam ini. Kemampuanmu tidak berfungsi.","Vision: {name} acts at night.":"Penglihatan: {name} beraksi di malam hari.","Vision: {name} does not act at night.":"Penglihatan: {name} tidak beraksi di malam hari.","Vision: {name} is on the {team} team.":"Penglihatan: {name} ada di tim {team}.","Vision: {name} is the {role}.":"Penglihatan: {name} adalah {role}.","Bad bet: {name} is not the {role}. You lose your vote today.":"Taruhan kalah: {name} bukan {role}. Kamu kehilangan hak suara hari ini.","Your bet paid off: {name} is the {role}. You earned a lucky charm.":"Taruhanmu menang: {name} adalah {role}. Kamu dapat jimat keberuntungan.","Your lucky charm saved you tonight!":"Jimat keberuntunganmu menyelamatkanmu malam ini!","You took {name}'s power. From tomorrow night you also have the {role}’s power.":"Kamu mengambil kekuatan {name}. Mulai besok malam kamu juga punya kekuatan {role}.","Once per game: take this dead player’s power. You keep it until you die.":"Sekali per permainan: ambil kekuatan pemain mati ini. Kekuatan itu milikmu sampai kamu mati.","With your last breath you saw your killer: {name}.":"Dengan napas terakhirmu kamu melihat pembunuhmu: {name}.","You can silence from the second night.":"Kamu baru bisa membungkam mulai malam kedua.","After this, your power recharges for three nights.":"Setelah ini, kekuatanmu mengisi ulang selama tiga malam.","Recharging: you can silence again on night {n}.":"Mengisi ulang: kamu bisa membungkam lagi di malam {n}.",'ID check: the card "{word}" belongs to {name}.':'Cek KTP: kartu "{word}" milik {name}.',"The Lightkeeper needs a Locksmith in the game.":"Penjaga Mercusuar butuh Tukang Kunci di dalam permainan.","The Medium can only reach the dead at night.":"Medium hanya bisa menghubungi arwah di malam hari.","Invalid guess.":"Tebakan tidak valid.","Invalid choice.":"Pilihan tidak valid.","There is no evidence to check right now.":"Belum ada bukti yang bisa dicek sekarang.","There is no such card.":"Kartu itu tidak ada.","No ID checks left today.":"Jatah cek KTP hari ini sudah habis.","You lost your vote on a bad bet.":"Kamu kehilangan hak suara karena kalah taruhan.","Not in this room.":"Kamu tidak ada di ruangan ini.","{name} is under your protection tonight.":"{name} ada dalam perlindunganmu malam ini.","Your shield stands before {name}.":"Perisaimu berdiri di depan {name}.","{name} is marked for death.":"{name} ditandai untuk mati.","{name} is in your sights.":"{name} ada dalam bidikanmu.","You tail {name} through the dark. The file arrives at dawn.":"Kamu membuntuti {name} dalam gelap. Berkasnya tiba saat fajar.","{name} will wake with a taped mouth.":"{name} akan bangun dengan mulut terlakban.","Your arrow binds two hearts.":"Panahmu mengikat dua hati.","Fresh bread for {name} at dawn.":"Roti hangat untuk {name} saat fajar.","{name}’s signal is yours tonight.":"Sinyal {name} milikmu malam ini.","{name}’s door is locked until morning.":"Pintu {name} terkunci sampai pagi.","Your light falls on {name}.":"Cahayamu jatuh pada {name}.","Your vision turns to {name}.":"Penglihatanmu tertuju pada {name}.","The dice are rolling on {name}.":"Dadu bergulir untuk {name}.","Tonight you wear {name}’s face.":"Malam ini kamu memakai wajah {name}.","{name}’s power flows into you.":"Kekuatan {name} mengalir ke dalam dirimu.","You strap on a vest.":"Kamu memakai rompi.","Auto-balance only sets these. Everyone else is a Citizen unless you add special roles below.":"Seimbangkan otomatis hanya mengatur ini. Sisanya jadi Warga, kecuali kamu menambah peran spesial di bawah.","{n} added":"{n} ditambahkan","Never added automatically. Pick the ones you want for this game.":"Tidak pernah ditambahkan otomatis. Pilih sendiri yang kamu mau untuk game ini.","Add a Locksmith first.":"Tambahkan Tukang Kunci dulu.","Core roles":"Peran inti","Special roles":"Peran spesial","Secret voting":"Voting rahasia","Nobody sees who voted for whom, only the totals":"Tidak ada yang tahu siapa memilih siapa, hanya jumlahnya","Mafia picks place & weapon":"Mafia memilih tempat & senjata","The killers choose where and how the victim dies":"Pembunuh memilih di mana dan bagaimana korban mati","Background check":"Pemeriksaan latar","Checking…":"Memeriksa…","ID checks left: {n}":"Sisa cek KTP: {n}","Check ID":"Cek KTP","Your private report":"Laporan rahasiamu","Correct guesses: {n}":"Tebakan benar: {n}","Lucky charms: {n}":"Jimat: {n}","Taken power: {role}":"Kekuatan diambil: {role}","Only {name} can read this":"Hanya {name} yang bisa membaca ini",Chosen:"Dipilih",Where:"Di mana",How:"Dengan apa","Leave it to fate":"Serahkan pada nasib","Bet placed":"Taruhan dipasang","1 · Who?":"1 · Siapa?","2 · Which role?":"2 · Peran apa?","No bet tonight":"Tidak bertaruh malam ini","Choose the place and the weapon":"Pilih tempat dan senjata","Hack a player":"Retas seorang pemain","Lock a door":"Kunci sebuah pintu","Study a player":"Amati seorang pemain","Place your bet":"Pasang taruhanmu","Shine your light":"Sorotkan cahayamu","Take someone’s shape":"Ambil wujud seseorang","Take a dead player’s power":"Ambil kekuatan pemain yang mati","Lovers’ whisper":"Bisikan kekasih","Séance: the dead are listening":"Pemanggilan arwah: para arwah mendengarkan",Died:"Mati","Mayor: your vote counts double today.":"Wali Kota: suaramu dihitung dua kali hari ini.","to read their private morning report":"untuk membaca laporan pagi rahasianya","Morning, {name}":"Pagi, {name}","Nothing unusual happened to you last night.":"Tidak ada yang aneh terjadi padamu semalam.","Done, hide it":"Selesai, sembunyikan",Remove:"Hapus","Before you enter room {code}, fill in your resident card. Everyone at the table will see this name and photo.":"Sebelum masuk ruangan {code}, isi dulu kartu pendudukmu. Semua pemain akan melihat nama dan foto ini.","Before you open a room, fill in your resident card. Everyone at the table will see this name and photo.":"Sebelum membuka ruangan, isi dulu kartu pendudukmu. Semua pemain akan melihat nama dan foto ini.","Save & join":"Simpan & gabung","Save & continue":"Simpan & lanjut","Who are you?":"Siapa kamu?","secret ballot":"voting rahasia",Suspicious:"Mencurigakan",Innocent:"Tidak bersalah","Correct guesses: {a}. Lucky charms: {b}. A wrong guess costs your vote tomorrow.":"Tebakan benar: {a}. Jimat: {b}. Tebakan salah membuatmu kehilangan suara besok.","You are dead. Watch quietly and keep the secrets.":"Kamu sudah mati. Tonton diam-diam dan jaga rahasianya.","Tap your card to see your secret role. Do not show anyone.":"Ketuk kartumu untuk melihat peran rahasiamu. Jangan tunjukkan ke siapa pun.","Night: pass the device as shown.":"Malam: oper HP sesuai petunjuk.","Make your secret move below, then wait for dawn.":"Lakukan aksi rahasiamu di bawah, lalu tunggu fajar.","Your part is done. Wait for dawn.":"Bagianmu selesai. Tunggu fajar.","Morning news: see who survived the night.":"Kabar pagi: lihat siapa yang selamat semalam.","Introduce yourselves. Tap “Start the first night” when everyone is ready.":"Kenalan dulu. Ketuk “Mulai malam pertama” kalau semua sudah siap.","Introduce yourselves and read your role guide. Night falls when the timer ends.":"Kenalan dulu dan baca panduan peranmu. Malam tiba saat waktu habis.","Discuss who the Mafia might be, then open the vote.":"Diskusikan siapa kira-kira Mafia, lalu buka voting.","Discuss who the Mafia might be. The vote opens when the timer ends.":"Diskusikan siapa kira-kira Mafia. Voting dibuka saat waktu habis.","Vote: tap a voter, then their choice.":"Voting: ketuk pemilih, lalu pilihannya.","Vote for the player you think is Mafia.":"Vote pemain yang menurutmu Mafia.","Vote cast. You can change it until everyone has voted.":"Suara masuk. Kamu masih bisa menggantinya sampai semua selesai vote.","You are on trial. Defend yourself!":"Kamu sedang diadili. Bela dirimu!","Listen to the accused defend themselves.":"Dengarkan pembelaan si tertuduh.","Decide: guilty or not guilty?":"Putuskan: bersalah atau tidak?","The verdict is in.":"Putusan sudah keluar.","Day cycle":"Siklus hari",Discuss:"Diskusi",Vote:"Vote","At night":"Saat malam","During the day":"Saat siang","How you win":"Cara menang","How to play: {role}":"Cara main: {role}","Tap a role to see how it plays.":"Ketuk peran untuk melihat cara mainnya.","First morning":"Pagi pertama","Nobody has died yet. Get to know the town.":"Belum ada yang mati. Kenali dulu warga kota.","Someone in this town is Mafia. Nobody knows who, except the Mafia themselves.":"Ada Mafia di kota ini. Tidak ada yang tahu siapa, kecuali Mafia sendiri.","Introduce yourself and act natural. Watch how people talk.":"Perkenalkan dirimu dan bersikap biasa. Perhatikan cara orang bicara.","Tonight everyone sleeps and the special roles act. Tomorrow you find out who died, discuss, and vote.":"Malam ini semua tidur dan peran khusus beraksi. Besok kalian tahu siapa yang mati, berdiskusi, lalu voting.","Start the first night":"Mulai malam pertama","Welcome to Nightfall":"Selamat datang di Nightfall","Roles in this game":"Peran di game ini","One day in Nightfall":"Satu hari di Nightfall","wins if alive at the end with two correct guesses.":"menang kalau masih hidup di akhir dengan dua tebakan benar.","Dead players stay in the room as ghosts: they can watch, but must keep the secrets.":"Pemain yang mati tetap di ruangan sebagai arwah: boleh menonton, tapi harus jaga rahasia.","These are in almost every game. Auto-balance adds them for you. Tap one to learn it.":"Peran ini ada di hampir setiap game. Seimbangkan otomatis menambahkannya untukmu. Ketuk untuk mempelajarinya.","The host adds these by hand to spice up a game. Tap one to learn it.":"Host menambahkannya sendiri supaya game makin seru. Ketuk untuk mempelajarinya.","Playing together":"Main bareng","Far apart: a room":"Beda tempat: pakai ruangan","One person taps Create room and shares the 5-letter code.":"Satu orang ketuk Buat ruangan lalu bagikan kode 5 hurufnya.","Everyone else taps Join room and types the code, from anywhere.":"Yang lain ketuk Gabung ruangan dan ketik kodenya, dari mana saja.","The host keeps the game open and the screen on until the end: the room lives on the host’s phone.":"Host harus membiarkan game terbuka dan layar menyala sampai selesai: ruangannya ada di HP host.","Talk on a voice or video call while you play. It is much more fun.":"Main sambil telepon atau video call. Jauh lebih seru.","Same table: pass & play":"Satu meja: oper HP","One phone, passed around. Everyone looks only at their own turn. No internet needed.":"Satu HP dioper bergiliran. Tiap orang hanya melihat gilirannya sendiri. Tanpa internet.","Let’s play":"Ayo main",Next:"Lanjut","Full rules & random events":"Aturan lengkap & kejadian acak","Introduction, every role, playing together.":"Pengenalan, semua peran, cara main bareng.","The first morning. Nobody has died yet. Meet the town: the first night falls soon.":"Pagi pertama. Belum ada yang mati. Kenali warga kota: malam pertama segera tiba.","The host is running an older version of the game. Ask the host to close the game and open the link again (refresh), then make a new room.":"Host masih pakai versi game yang lama. Minta host menutup game lalu buka link-nya lagi (refresh), lalu buat ruangan baru.","Your game is out of date. Refresh the page, then join again.":"Versi game-mu sudah lama. Refresh halaman ini, lalu gabung lagi.","{name} is on a different game version. Everyone should refresh the link before playing.":"{name} memakai versi game yang berbeda. Semua sebaiknya refresh link-nya sebelum main.","Serial Killer":"Pembunuh Berantai","Kill one player every night. Win alone.":"Bunuh satu pemain tiap malam. Menang sendirian.","Each night, kill one player. The Mafia cannot kill you at night. You win if you are one of the last two players alive. Town and Mafia both want you dead.":"Setiap malam, bunuh satu pemain. Mafia tidak bisa membunuhmu di malam hari. Kamu menang kalau termasuk dua pemain terakhir yang hidup. Warga dan Mafia sama-sama ingin kamu mati.",Janitor:"Tukang Bersih","Clean away one Mafia victim’s body.":"Bersihkan mayat satu korban Mafia.","You are part of the Mafia. Once per game, clean up tonight’s Mafia victim: their role is never announced and the crime scene is wiped. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Sekali per game, bersihkan korban Mafia malam itu: perannya tidak pernah diumumkan dan TKP-nya dihapus. Kamu juga ikut memilih target Mafia.",Framer:"Penjebak","Make an innocent look guilty.":"Bikin orang tak bersalah terlihat bersalah.","You are part of the Mafia. Each night, frame one player: if the Detective investigates them tonight, they appear Suspicious. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, jebak satu pemain: kalau Detektif menyelidikinya malam itu, dia terlihat Mencurigakan. Kamu juga ikut memilih target Mafia.",Coroner:"Forensik","Examine a body for the truth.":"Periksa mayat untuk mencari kebenaran.","Each night, examine one dead player. You learn their true role and which team killed them, even if the body was cleaned.":"Setiap malam, periksa satu pemain yang sudah mati. Kamu tahu peran aslinya dan tim mana yang membunuhnya, walaupun mayatnya sudah dibersihkan.",Tracker:"Pelacak","Follow a player and see where they go.":"Ikuti satu pemain dan lihat ke mana dia pergi.","Each night, follow one player. At dawn you learn who they visited, or that they stayed home.":"Setiap malam, ikuti satu pemain. Saat fajar kamu tahu siapa yang dia datangi, atau dia diam di rumah.",Spy:"Mata-mata","Eavesdrop on the Mafia’s chat.":"Menyadap chat Mafia.","You can read the Mafia’s night chat, but the line is bad: names are hidden and some words are lost. You cannot write in it.":"Kamu bisa membaca chat malam Mafia, tapi sinyalnya jelek: nama disamarkan dan sebagian kata hilang. Kamu tidak bisa menulis di sana.",Executioner:"Algojo","Get your target voted out.":"Bikin targetmu di-vote keluar.","You are given one target from the town. You win if the town votes them out. If they die any other way, you become a Jester.":"Kamu diberi satu target dari warga. Kamu menang kalau warga mem-vote dia keluar. Kalau dia mati dengan cara lain, kamu jadi Badut.",Veteran:"Veteran","Go on alert and shoot every visitor.":"Siaga dan tembak setiap tamu.","Twice per game, go on alert for the night. Anyone who visits you that night is shot dead, friend or foe, and you cannot be killed while on alert.":"Dua kali per game, siaga semalaman. Siapa pun yang mendatangimu malam itu ditembak mati, kawan atau lawan, dan kamu tidak bisa dibunuh selama siaga.",Journalist:"Jurnalis","Publish one player’s role to everyone.":"Umumkan peran satu pemain ke semua orang.","Once per game, investigate one player at night. The next morning, their role is printed in the paper for the whole town to read.":"Sekali per game, selidiki satu pemain di malam hari. Paginya, perannya dimuat di koran untuk dibaca seluruh kota.",Twin:"Kembar","You know your twin is innocent.":"Kamu tahu kembaranmu tidak bersalah.","There are always two Twins. You know who your twin is, and both of you are Town. Trust each other.":"Kembar selalu ada dua. Kamu tahu siapa kembaranmu, dan kalian berdua Warga. Saling percayalah.","Security Guard":"Penjaga CCTV","Watch one room on CCTV.":"Pantau satu ruangan lewat CCTV.","Realistic mode only. Each night, watch one room through its camera. At dawn you see who hid there, who came in, what happened, and where the footprints lead.":"Hanya di mode realistis. Setiap malam, pantau satu ruangan lewat kameranya. Saat fajar kamu lihat siapa yang sembunyi di sana, siapa yang masuk, apa yang terjadi, dan ke mana jejak kakinya.","Pick a room to hide in tonight. Everyone hides, the Mafia too. If you do not choose, you end up somewhere at random.":"Pilih ruangan untuk sembunyi malam ini. Semua sembunyi, Mafia juga. Kalau tidak memilih, kamu ditempatkan secara acak.","{n} alerts left. On alert you shoot every visitor, friend or foe.":"Sisa siaga: {n}. Saat siaga kamu menembak setiap tamu, kawan atau lawan.","{n} alert left. On alert you shoot every visitor, friend or foe.":"Sisa siaga: {n}. Saat siaga kamu menembak setiap tamu, kawan atau lawan.","Follow a player. At dawn you learn who they visited.":"Ikuti satu pemain. Saat fajar kamu tahu siapa yang dia datangi.","No bodies to examine yet.":"Belum ada mayat untuk diperiksa.","Choose your victim. The Mafia cannot kill you at night.":"Pilih korbanmu. Mafia tidak bisa membunuhmu di malam hari.","Choose a room to raid. If nobody is hiding there, the hunt fails and one of you may die (most likely the one who made the call).":"Pilih ruangan untuk digerebek. Kalau tidak ada yang sembunyi di sana, perburuan gagal dan salah satu dari kalian bisa mati (paling mungkin yang memilih ruangannya).","Choose a room to raid. If nobody is hiding there, the hunt fails.":"Pilih ruangan untuk digerebek. Kalau tidak ada yang sembunyi di sana, perburuan gagal.","Once per game: clean tonight’s victim. Their role stays secret and the scene is wiped.":"Sekali per game: bersihkan korban malam ini. Perannya tetap rahasia dan TKP-nya dihapus.","Your twin is {name}. You can trust them.":"Kembaranmu adalah {name}. Kamu bisa percaya padanya.","Once per game: their role is printed in tomorrow’s paper for everyone.":"Sekali per game: perannya dimuat di koran besok untuk semua orang.","You are listening in on the Mafia’s line. Check the bugged chat.":"Kamu sedang menyadap jalur Mafia. Cek chat yang disadap.","Choose one camera to watch tonight. At dawn you get the footage.":"Pilih satu kamera untuk dipantau malam ini. Saat fajar kamu dapat rekamannya.","Your target is {name}. Get the town to vote them out.":"Targetmu adalah {name}. Bikin warga mem-vote dia keluar.","If the Detective investigates this player tonight, they look Suspicious.":"Kalau Detektif menyelidiki pemain ini malam ini, dia terlihat Mencurigakan.","Examine a body: you learn the true role and which side killed them.":"Periksa mayat: kamu tahu peran aslinya dan pihak mana yang membunuhnya.","Your story has already run.":"Beritamu sudah terbit.","A peaceful night: even you stay home.":"Malam damai: bahkan kamu diam di rumah.","You have no alerts left.":"Jatah siagamu sudah habis.","You have already cleaned a body.":"Kamu sudah pernah membersihkan mayat.","{name} stayed home all night.":"{name} diam di rumah sepanjang malam.","{name} visited {who}.":"{name} mendatangi {who}.","{name} went to {room} in the dark.":"{name} pergi ke {room} dalam gelap.","You stayed up on alert. {n} alert left.":"Kamu berjaga semalaman. Sisa siaga: {n}.","You stayed up on alert. {n} alerts left.":"Kamu berjaga semalaman. Sisa siaga: {n}.","Someone came for you tonight. You fought them off.":"Ada yang datang mengincarmu malam ini. Kamu berhasil melawannya.","You shot {name} when they came to your door.":"Kamu menembak {name} saat dia datang ke pintumu.","Your target died before the town could vote them out. You are now a Jester: get yourself voted out.":"Targetmu mati sebelum warga sempat mem-vote dia. Sekarang kamu Badut: bikin dirimu di-vote keluar.","The raid on {room} found nobody. The hunt failed.":"Penggerebekan di {room} tidak menemukan siapa pun. Perburuan gagal.","{name} vanished during a failed hunt. Their body was found in {room}.":"{name} menghilang saat perburuan yang gagal. Mayatnya ditemukan di {room}.","{name} was shot dead in {room} by someone on alert.":"{name} ditembak mati di {room} oleh seseorang yang sedang siaga.","{name} was found dead in {room}. A serial killer is loose.":"{name} ditemukan tewas di {room}. Ada pembunuh berantai berkeliaran.","Breaking news: {name} is the {role}.":"Berita terkini: {name} adalah {role}.","{name} was the Executioner and got their target voted out!":"{name} adalah Algojo dan berhasil membuat targetnya di-vote keluar!","The Serial Killer is one of the last ones standing.":"Pembunuh Berantai termasuk yang terakhir bertahan.","You cleaned up after the murder of {name}. Nobody will know who they were.":"Kamu membersihkan bekas pembunuhan {name}. Tidak akan ada yang tahu siapa dia.","The body of {name} was scrubbed clean. Nobody knows who they were.":"Mayat {name} sudah dibersihkan. Tidak ada yang tahu siapa dia sebenarnya.","Autopsy: {name} was the {role}. {cause}":"Otopsi: {name} adalah {role}. {cause}","The Mafia killed them.":"Dibunuh oleh Mafia.","A serial killer did this.":"Ini perbuatan pembunuh berantai.","They were shot by the Sheriff.":"Ditembak oleh Sheriff.","They were shot by a Veteran on alert.":"Ditembak oleh Veteran yang sedang siaga.","They took their own life out of guilt.":"Bunuh diri karena rasa bersalah.","They died in a bomb blast.":"Tewas karena ledakan bom.","They died of a broken heart.":"Mati karena patah hati.","The town voted them out.":"Di-vote keluar oleh warga.","The Mafia’s own hunt went wrong.":"Perburuan Mafia sendiri yang gagal.","Killed in the confusion of a failed hunt.":"Tewas dalam kekacauan perburuan yang gagal.","Shot at close range by someone who was waiting.":"Ditembak dari jarak dekat oleh seseorang yang sudah menunggu.","Unknown. The ns you are the Detective, you are next.","Bagikan temuanmu dengan hati-hati: kalau Mafia tahu kamu Detektif, kamu target berikutnya."],win:be},doctor:{night:["Pick one player to protect. If the Mafia attacks them tonight, they live. Not the same person twice in a row.","Pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya malam ini, dia selamat. Tidak boleh orang yang sama dua malam berturut-turut."],day:["Guess who the Mafia wants dead next. Protect the players who are helping the town most.","Tebak siapa yang ingin dibunuh Mafia berikutnya. Lindungi pemain yang paling membantu warga."],win:be},bodyguard:{night:["Once per game, pick a player to guard for good. The first attack on them is blocked.","Sekali per game, pilih satu pemain untuk dijaga selamanya. Serangan pertama ke dia akan ditahan."],day:["Choose someone you trust and who matters: a confirmed Detective is a great pick.","Pilih orang yang kamu percaya dan penting: Detektif yang sudah terbukti adalah pilihan bagus."],win:be},sheriff:{night:["You may shoot one player. Bullets are limited, and shooting an innocent can cost you your life.","Kamu boleh menembak satu pemain. Pelurumu terbatas, dan menembak orang tak bersalah bisa membuatmu mati."],day:["Only fire when you are sure. Use the day to build the case first.","Tembak hanya kalau yakin. Kumpulkan bukti dulu di siang hari."],win:be},mafia:{night:["Wake with your partners, chat in the Mafia den and agree on one victim.","Bangun bersama rekanmu, ngobrol di markas Mafia dan sepakati satu korban."],day:Ds,win:ua},godfather:{night:["You lead the Mafia: your pick of victim beats the others.","Kamu pemimpin Mafia: pilihan korbanmu mengalahkan yang lain."],day:["The Detective sees you as Innocent, so you can afford to talk boldly.","Detektif melihatmu Tidak Bersalah, jadi kamu bisa bicara lebih berani."],win:ua},silencer:{night:["From night 2, tape one player’s mouth: they cannot talk tomorrow. Then wait three nights to do it again.","Mulai malam 2, la
