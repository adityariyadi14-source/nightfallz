idak bersalah.","Each night, choose one player to protect. If the Mafia attacks them, they survive. You may not protect the same player two nights in a row.":"Setiap malam, pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya, dia selamat. Kamu tidak boleh melindungi orang yang sama dua malam berturut-turut.","Once per game, choose one player to guard. Your choice is permanent. The first attack on that player is blocked.":"Sekali dalam permainan, pilih satu pemain untuk dijaga. Pilihanmu permanen. Serangan pertama ke pemain itu akan ditahan.","You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you.":"Pelurumu terbatas. Di malam hari kamu boleh menembak satu pemain. Kalau yang kamu tembak ternyata warga tak bersalah, rasa bersalah bisa membunuhmu.","Each night, the Mafia agrees on one player to eliminate. Blend in during the day and avoid suspicion.":"Setiap malam, Mafia sepakat menghabisi satu pemain. Berbaurlah di siang hari dan hindari kecurigaan.","You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent.":"Kamu pemimpin Mafia. Pilihan targetmu mengalahkan yang lain. Detektif melihatmu Tidak Bersalah.","You are part of the Mafia. Each night, choose one player: they cannot speak during the next day. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, pilih satu pemain: dia tidak bisa bicara besok. Kamu juga ikut memilih target Mafia.","You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss.":"Kamu menang kalau warga mem-vote kamu keluar. Bertingkahlah mencurigakan, tapi jangan berlebihan. Mati di malam hari berarti kalah.","You win if you are alive when the game ends, whoever else wins. You have a limited number of bulletproof vests to use at night.":"Kamu menang kalau masih hidup saat permainan berakhir, siapa pun pemenangnya. Kamu punya rompi antipeluru terbatas untuk dipakai di malam hari.","On the first night, choose two players to fall in love (you may choose yourself). The lovers learn who each other is. If one lover dies, by night or by vote, the other dies of a broken heart.":"Di malam pertama, pilih dua pemain untuk saling jatuh cinta (boleh dirimu sendiri). Pasangan itu tahu siapa kekasihnya. Kalau salah satu mati, di malam hari atau karena vote, yang lain ikut mati patah hati.","You have no night action, but you are wired to blow. If the Mafia kills you, the blast takes one of them with you. If the town votes you out, the blast takes one of the players who voted for you.":"Kamu tidak punya aksi malam, tapi tubuhmu dipasangi bom. Kalau Mafia membunuhmu, ledakannya ikut menewaskan salah satu dari mereka. Kalau warga mem-vote kamu keluar, ledakannya menewaskan salah satu pemain yang memilihmu.","Each night, deliver fresh bread to another player. The whole town sees who got bread, and that player's vote counts double the next day. Feed the people you trust.":"Setiap malam, antarkan roti hangat ke pemain lain. Semua orang tahu siapa yang dapat roti, dan suara pemain itu dihitung dua kali besok. Beri makan orang yang kamu percaya.","Blood Moon":"Bulan Darah","Peaceful Night":"Malam Damai","Thick Fog":"Kabut Tebal","Town Elder":"Tetua Kota","Secret Ballot":"Pemungutan Rahasia","Short Fuse":"Sumbu Pendek","The Mafia is emboldened: every Mafia member may choose a separate target tonight.":"Mafia makin berani: setiap anggota Mafia boleh memilih target sendiri malam ini.","A strange calm falls over the town. No one can be killed tonight.":"Ketenangan aneh menyelimuti kota. Tidak ada yang bisa dibunuh malam ini.","Visibility is poor. The Detective receives no result tonight.":"Jarak pandang buruk. Detektif tidak mendapat hasil malam ini.","A randomly chosen player is named Town Elder: their vote counts twice today.":"Satu pemain acak dijadikan Tetua Kota: suaranya dihitung dua kali hari ini.","Votes are cast in secret today. Only totals are revealed.":"Hari ini voting dilakukan diam-diam. Hanya totalnya yang ditampilkan.","Tempers are high. Discussion time is halved today.":"Emosi memuncak. Waktu diskusi dipotong setengah hari ini.","{event}: {desc}":"{event}: {desc}",Map:"Peta",Random:"Acak",Village:"Desa",House:"Rumah",Hospital:"Rumah Sakit",Villa:"Vila","A different place every game.":"Tempat berbeda di setiap permainan.","A sleepy farming village with one road in and none out.":"Desa pertanian yang sepi. Ada satu jalan masuk, tak ada jalan keluar.","One big family house. Every door locks from the inside.":"Satu rumah keluarga besar. Semua pintu terkunci dari dalam.","A night shift at St. Agatha. The nurses see everything.":"Shift malam di RS St. Agatha. Para perawat melihat semuanya.","A private villa on a cliff. Champagne, secrets, no signal.":"Vila pribadi di tepi tebing. Sampanye, rahasia, tanpa sinyal.","The map decides where bodies are found and how each victim was killed.":"Peta menentukan di mana mayat ditemukan dan bagaimana korban dibunuh.","Crime scene · {map}":"TKP · {map}","Case file":"Berkas kasus","T.O.D.":"W.K.",Found:"Lokasi",Cause:"Penyebab",Clue:"Petunjuk","in {room}":"di {room}","the street":"jalanan","the town square":"alun-alun","the church bell tower":"menara lonceng gereja","the old well":"sumur tua","the barn":"lumbung","the windmill":"kincir angin","the cemetery":"pemakaman","the tavern cellar":"gudang bawah kedai","the riverbank":"tepi sungai","the kitchen":"dapur","the living room":"ruang tamu","the basement":"ruang bawah tanah","the attic":"loteng","the bathroom":"kamar mandi","the garden shed":"gudang kebun","the garage":"garasi","the staircase":"tangga","the emergency room":"IGD","the morgue":"kamar jenazah","the pharmacy":"apotek","the operating theatre":"ruang operasi","the nurse station":"pos perawat","the elevator":"lift","the rooftop":"atap gedung","the X-ray room":"ruang rontgen","the swimming pool":"kolam renang","the wine cellar":"gudang anggur","
