dak bersalah.","Each night, choose one player to protect. If the Mafia attacks them, they survive. You may not protect the same player two nights in a row.":"Setiap malam, pilih satu pemain untuk dilindungi. Kalau Mafia menyerangnya, dia selamat. Kamu tidak boleh melindungi orang yang sama dua malam berturut-turut.","Once per game, choose one player to guard. Your choice is permanent. The first attack on that player is blocked.":"Sekali dalam permainan, pilih satu pemain untuk dijaga. Pilihanmu permanen. Serangan pertama ke pemain itu akan ditahan.","You carry a limited number of bullets. At night you may shoot a player. If you shoot an innocent townsperson, guilt may consume you.":"Pelurumu terbatas. Di malam hari kamu boleh menembak satu pemain. Kalau yang kamu tembak ternyata warga tak bersalah, rasa bersalah bisa membunuhmu.","Each night, the Mafia agrees on one player to eliminate. Blend in during the day and avoid suspicion.":"Setiap malam, Mafia sepakat menghabisi satu pemain. Berbaurlah di siang hari dan hindari kecurigaan.","You lead the Mafia. Your choice of target overrides the others. Detectives see you as Innocent.":"Kamu pemimpin Mafia. Pilihan targetmu mengalahkan yang lain. Detektif melihatmu Tidak Bersalah.","You are part of the Mafia. Each night, choose one player: they cannot speak during the next day. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, pilih satu pemain: dia tidak bisa bicara besok. Kamu juga ikut memilih target Mafia.","You win if the town votes you out. Act suspicious, but not too suspicious. Being killed at night is a loss.":"Kamu menang kalau warga mem-vote kamu keluar. Bertingkahlah mencurigakan, tapi jangan berlebihan. Mati di malam hari berarti kalah.","You win if you are alive when the game ends, whoever else wins. You have a limited number of bulletproof vests to use at night.":"Kamu menang kalau masih hidup saat permainan berakhir, siapa pun pemenangnya. Kamu punya rompi antipeluru terbatas untuk dipakai di malam hari.","On the first night, choose two players to fall in love (you may choose yourself). The lovers learn who each other is. If one lover dies, by night or by vote, the other dies of a broken heart.":"Di malam pertama, pilih dua pemain untuk saling jatuh cinta (boleh dirimu sendiri). Pasangan itu tahu siapa kekasihnya. Kalau salah satu mati, di malam hari atau karena vote, yang lain ikut mati patah hati.","You have no night action, but you are wired to blow. If the Mafia kills you, the blast takes one of them with you. If the town votes you out, the blast takes one of the players who voted for you.":"Kamu tidak punya aksi malam, tapi tubuhmu dipasangi bom. Kalau Mafia membunuhmu, ledakannya ikut menewaskan salah satu dari mereka. Kalau warga mem-vote kamu keluar, ledakannya menewaskan salah satu pemain yang memilihmu.","Each night, deliver fresh bread to another player. The whole town sees who got bread, and that player's vote counts double the next day. Feed the people you trust.":"Setiap malam, antarkan roti hangat ke pemain lain. Semua orang tahu siapa yang dapat roti, dan suara pemain itu dihitung dua kali besok. Beri makan orang yang kamu percaya.","Blood Moon":"Bulan Darah","Peaceful Night":"Malam Damai","Thick Fog":"Kabut Tebal","Town Elder":"Tetua Kota","Secret Ballot":"Pemungutan Rahasia","Short Fuse":"Sumbu Pendek","The Mafia is emboldened: every Mafia member may choose a separate target tonight.":"Mafia makin berani: setiap anggota Mafia boleh memilih target sendiri malam ini.","A strange calm falls over the town. No one can be killed tonight.":"Ketenangan aneh menyelimuti kota. Tidak ada yang bisa dibunuh malam ini.","Visibility is poor. The Detective receives no result tonight.":"Jarak pandang buruk. Detektif tidak mendapat hasil malam ini.","A randomly chosen player is named Town Elder: their vote counts twice today.":"Satu pemain acak dijadikan Tetua Kota: suaranya dihitung dua kali hari ini.","Votes are cast in secret today. Only totals are revealed.":"Hari ini voting dilakukan diam-diam. Hanya totalnya yang ditampilkan.","Tempers are high. Discussion time is halved today.":"Emosi memuncak. Waktu diskusi dipotong setengah hari ini.","{event}: {desc}":"{event}: {desc}",Map:"Peta",Random:"Acak",Village:"Desa",House:"Rumah",Hospital:"Rumah Sakit",Villa:"Vila","A different place every game.":"Tempat berbeda di setiap permainan.","A sleepy farming village with one road in and none out.":"Desa pertanian yang sepi. Ada satu jalan masuk, tak ada jalan keluar.","One big family house. Every door locks from the inside.":"Satu rumah keluarga besar. Semua pintu terkunci dari dalam.","A night shift at St. Agatha. The nurses see everything.":"Shift malam di RS St. Agatha. Para perawat melihat semuanya.","A private villa on a cliff. Champagne, secrets, no signal.":"Vila pribadi di tepi tebing. Sampanye, rahasia, tanpa sinyal.","The map decides where bodies are found and how each victim was killed.":"Peta menentukan di mana mayat ditemukan dan bagaimana korban dibunuh.","Crime scene · {map}":"TKP · {map}","Case file":"Berkas kasus","T.O.D.":"W.K.",Found:"Lokasi",Cause:"Penyebab",Clue:"Petunjuk","in {room}":"di {room}","the street":"jalanan","the town square":"alun-alun","the church bell tower":"menara lonceng gereja","the old well":"sumur tua","the barn":"lumbung","the windmill":"kincir angin","the cemetery":"pemakaman","the tavern cellar":"gudang bawah kedai","the riverbank":"tepi sungai","the kitchen":"dapur","the living room":"ruang tamu","the basement":"ruang bawah tanah","the attic":"loteng","the bathroom":"kamar mandi","the garden shed":"gudang kebun","the garage":"garasi","the staircase":"tangga","the emergency room":"IGD","the morgue":"kamar jenazah","the pharmacy":"apotek","the operating theatre":"ruang operasi","the nurse station":"pos perawat","the elevator":"lift","the rooftop":"atap gedung","the X-ray room":"ruang rontgen","the swimming pool":"kolam renang","the wine cellar":"gudang anggur","t di malam 1; sekali tiap 3 malam.","You are part of the Mafia. From the second night, you can silence one player for the next day, then you must wait three nights before silencing again. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Mulai malam kedua, kamu bisa membungkam satu pemain untuk hari berikutnya, lalu harus menunggu tiga malam sebelum bisa membungkam lagi. Kamu juga ikut memilih target Mafia.",Mayor:"Wali Kota","Your vote counts twice, every other day.":"Suaramu dihitung dua kali, selang sehari.","You lead the town. On odd-numbered days (day 1, 3, 5…) your vote counts twice. On even days it recharges and counts once.":"Kamu pemimpin kota. Di hari ganjil (hari 1, 3, 5…) suaramu dihitung dua kali. Di hari genap suaramu mengisi ulang dan dihitung sekali.",Hacker:"Peretas","Scramble the information around one player.":"Kacaukan informasi di sekitar satu pemain.","You are part of the Mafia. Each night, hack one player. Any investigation they make, and any investigation made on them, returns corrupted results tonight. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, retas satu pemain. Semua penyelidikan yang dia lakukan, dan semua penyelidikan terhadap dirinya, memberi hasil rusak malam ini. Kamu juga ikut memilih target Mafia.",Locksmith:"Tukang Kunci","Lock one player’s ability for the night.":"Kunci kemampuan satu pemain untuk malam ini.","Each night, lock one player. Whatever ability they have does nothing tonight, including a Mafia member’s vote on who dies. Locking someone with no ability has no effect.":"Setiap malam, kunci satu pemain. Kemampuan apa pun yang dia punya tidak berfungsi malam ini, termasuk suara anggota Mafia soal siapa yang dibunuh. Mengunci orang tanpa kemampuan tidak berefek apa-apa.",Oracle:"Peramal","Learn one player’s identity, a little more each night.":"Ketahui identitas satu pemain, sedikit demi sedikit tiap malam.","Each night, study one player. Night one reveals whether they act at night, the next reveals their team, the third reveals their exact role. Switching to someone else starts over.":"Setiap malam, amati satu pemain. Malam pertama mengungkap apakah dia beraksi di malam hari, berikutnya timnya, dan yang ketiga peran persisnya. Ganti orang berarti mulai dari awal.",Gambler:"Penjudi","Guess roles. Win big or pay the price.":"Tebak peran. Menang besar atau tanggung akibatnya.","Each night, guess one player’s role. Guess right and you earn a lucky charm that survives one attack. Guess wrong and you lose your vote the next day. You win if you are alive at the end with at least two correct guesses.":"Setiap malam, tebak peran satu pemain. Tebakan benar memberimu jimat keberuntungan yang menahan satu serangan. Tebakan salah membuatmu kehilangan hak suara besok. Kamu menang kalau masih hidup di akhir dengan minimal dua tebakan benar.",Lightkeeper:"Penjaga Mercusuar","Shield one player from locks and hacks.":"Lindungi satu pemain dari kunci dan retasan.","Only in games with a Locksmith. Each night, shine your light on one player: they cannot be locked or hacked tonight, and you learn whether anyone tried.":"Hanya ada kalau ada Tukang Kunci. Setiap malam, sorot satu pemain dengan cahayamu: dia tidak bisa dikunci atau diretas malam ini, dan kamu tahu apakah ada yang mencoba.",Shapeshifter:"Pengubah Wujud","Disguise yourself as another player at night.":"Menyamar jadi pemain lain di malam hari.","You are part of the Mafia. Each night, take another player’s shape: anyone investigating you tonight sees that player’s identity instead of yours. You also help choose the Mafia target.":"Kamu bagian dari Mafia. Setiap malam, ambil wujud pemain lain: siapa pun yang menyelidikimu malam ini melihat identitas orang itu, bukan identitasmu. Kamu juga ikut memilih target Mafia.",Medium:"Medium","Talk with the dead at night.":"Bicara dengan arwah di malam hari.","At night you can hear and speak with the spirits of the dead. Ask them what they saw before they died.":"Di malam hari kamu bisa mendengar dan berbicara dengan arwah orang mati. Tanyakan apa yang mereka lihat sebelum mati.",Witness:"Saksi","If you are murdered, you see your killer.":"Kalau kamu dibunuh, kamu melihat pembunuhmu.","If the Mafia kills you at night, you see who did it in your last moment. Use your last words well.":"Kalau Mafia membunuhmu di malam hari, di detik terakhir kamu melihat siapa pelakunya. Manfaatkan pesan terakhirmu baik-baik.",Retributionist:"Pembalas","Take a dead player’s power, once, for good.":"Ambil kekuatan pemain yang sudah mati, sekali, selamanya.","Once per game, choose a dead player whose power you want. From the next night you use that ability as your own until you die.":"Sekali dalam permainan, pilih pemain mati yang kekuatannya kamu mau. Mulai malam berikutnya kamu memakai kemampuan itu sebagai milikmu sampai kamu mati.","Choose where the victim dies and with what. The deciding vote picks the scene.":"Pilih di mana korban mati dan dengan apa. Suara penentu yang memilih TKP-nya.","Investigations by or about this player return corrupted results tonight.":"Penyelidikan oleh atau terhadap pemain ini memberi hasil rusak malam ini.","Their ability does nothing tonight. Locking someone with no ability has no effect.":"Kemampuannya tidak berfungsi malam ini. Mengunci orang tanpa kemampuan tidak berefek.","No dead player has a power you can take yet.":"Belum ada pemain mati yang kekuatannya bisa kamu ambil.","The dead can hear you tonight. Speak with them in the graveyard chat.":"Para arwah bisa mendengarmu malam ini. Bicaralah dengan mereka di chat kuburan.","They cannot be locked or hacked tonight. You will learn if anyone tried.":"Dia tidak bisa dikunci atau diretas malam ini. Kamu akan tahu kalau ada yang mencoba.","If you are murdered tonight, you will see who did it.":"Kalau kamu dibunuh malam ini, kamu akan melihat pelakunya.","Anyone investigating you tonight sees this player instead.":"Siapa pun yang menyelidikimu malam ini akan melihat pemain ini.","Choose a player to study. Each night on the same player reveals more.":"Pilih pemain untuk diamati. Tiap malam pada orang yang sama mengungkap lebih banyak.","Studying {name}: vision {a} of 3. Choose them again to see more, or start over with someone new.":"Mengamati {name}: penglihatan {a} dari 3. Pilih dia lagi untuk melihat lebih jauh, atau mulai ulang dengan orang lain.","You locked {name} in for the night.":"Kamu mengunci {name} semalaman.","Your light watched over {name}. Nobody tried to tamper with them.":"Cahayamu menjaga {name}. Tidak ada yang mencoba mengganggunya.","Someone tried to tamper with {name}, but your light kept them safe.":"Ada yang mencoba mengganggu {name}, tapi cahayamu melindunginya.","Your door was locked tonight. Your ability did nothing.":"Pintumu dikunci malam ini. Kemampuanmu tidak berfungsi.","Vision: {name} acts at night.":"Penglihatan: {name} beraksi di malam hari.","Vision: {name} does not act at night.":"Penglihatan: {name} tidak beraksi di malam hari.","Vision: {name} is on the {team} team.":"Penglihatan: {name} ada di tim {team}.","Vision: {name} is the {role}.":"Penglihatan: {name} adalah {role}.","Bad bet: {name} is not the {role}. You lose your vote today.":"Taruhan kalah: {name} bukan {role}. Kamu kehilangan hak suara hari ini.","Your bet paid off: {name} is the {role}. You earned a lucky charm.":"Taruhanmu menang: {name} adalah {role}. Kamu dapat jimat keberuntungan.","Your lucky charm saved you tonight!":"Jimat keberuntunganmu menyelamatkanmu malam ini!","You took {name}'s power. From tomorrow night you also have the {role}’s power.":"Kamu mengambil kekuatan {name}. Mulai besok malam kamu juga punya kekuatan {role}.","Once per game: take this dead player’s power. You keep it until you die.":"Sekali per permainan: ambil kekuatan pemain mati ini. Kekuatan itu milikmu sampai kamu mati.","With your last breath you saw your killer: {name}.":"Dengan napas terakhirmu kamu melihat pembunuhmu: {name}.","You  {name}’s face.":"Malam ini kamu memakai wajah {name}.","{name}’s power flows into you.":"Kekuatan {name} mengalir ke dalam dirimu.","You strap on a vest.":"Kamu memakai rompi.","Auto-balance only sets these. Everyone else is a Citizen unless you add special roles below.":"Seimbangkan otomatis hanya mengatur ini. Sisanya jadi Warga, kecuali kamu menambah peran spesial di bawah.","{n} added":"{n} ditambahkan","Never added automatically. Pick the ones you want for this game.":"Tidak pernah ditambahkan otomatis. Pilih sendiri yang kamu mau untuk game ini.","Add a Locksmith first.":"Tambahkan Tukang Kunci dulu.","Core roles":"Peran inti","Special roles":"Peran spesial","Secret voting":"Voting rahasia","Nobody sees who voted for whom, only the totals":"Tidak ada yang tahu siapa memilih siapa, hanya jumlahnya","Mafia picks place & weapon":"Mafia memilih tempat & senjata","The killers choose where and how the victim dies":"Pembunuh memilih di mana dan bagaimana korban mati","Background check":"Pemeriksaan latar","Checking…":"Memeriksa…","ID checks left: {n}":"Sisa cek KTP: {n}","Check ID":"Cek KTP","Your private report":"Laporan rahasiamu","Correct guesses: {n}":"Tebakan benar: {n}","Lucky charms: {n}":"Jimat: {n}","Taken power: {role}":"Kekuatan diambil: {role}","Only {name} can read this":"Hanya {name} yang bisa membaca ini",Chosen:"Dipilih",Where:"Di mana",How:"Dengan apa","Leave it to fate":"Serahkan pada nasib","Bet placed":"Taruhan dipasang","1 · Who?":"1 · Siapa?","2 · Which role?":"2 · Peran apa?","No bet tonight":"Tidak bertaruh malam ini","Choose the place and the weapon":"Pilih tempat dan senjata","Hack a player":"Retas seorang pemain","Lock a door":"Kunci sebuah pintu","Study a player":"Amati seorang pemain","Place your bet":"Pasang taruhanmu","Shine your light":"Sorotkan cahayamu","Take someone’s shape":"Ambil wujud seseorang","Take a dead player’s power":"Ambil kekuatan pemain yang mati","Lovers’ whisper":"Bisikan kekasih","Séance: the dead are listening":"Pe
